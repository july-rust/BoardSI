name: PH-08 one-shot P2 signed patch publication
on:
  push:
    branches:
      - research/ph08-operator-p2-fixes
    paths:
      - ".github/workflows/ph08-one-shot-p2.yml"
permissions:
  contents: write
jobs:
  verified-p2-publish:
    if: github.repository == 'july-rust/BoardSI'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Confirm full source and run P2 adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor ed3450a315cd48106d7c01a6f38a08e983c25e3e HEAD
          python -m unittest discover -s tools/validation -p 'test_ph08_recovery_operator_perturbation.py' -v
          python tools/validation/ph08_private_archive_guard.py
      - name: Publish four allowlisted P2 repairs to signed PR branch
        shell: bash
        run: |
          set -euo pipefail
          repo=july-rust/BoardSI
          target=feature/ph08-two-operator-verified
          expected_head=7a2ad5f66c4573805dd9d5158fb580040a313d3a
          actual_head=$(gh api "repos/$repo/git/ref/heads/$target" --jq '.object.sha')
          test "$actual_head" = "$expected_head" || { echo "Target branch moved: fail closed"; exit 1; }
          for file in             tools/validation/ph08_recovery_operator_perturbation.py             tools/validation/test_ph08_recovery_operator_perturbation.py             docs/validation/m2-g2-ph08-original-hmm-root-cause-analysis.md             .github/workflows/m2-ph08-two-operator.yml
          do
            expected=$(git hash-object "$file")
            current_blob=$(gh api "repos/$repo/contents/$file?ref=$target" --jq '.sha')
            encoded=$(base64 -w0 "$file")
            response=$(gh api -X PUT "repos/$repo/contents/$file"               -f "branch=$target"               -f "sha=$current_blob"               -f "message=fix(ph08): verified P2 repair $file"               -f "content=$encoded")
            actual_blob=$(printf '%s' "$response" | jq -r '.content.sha')
            signed_commit=$(printf '%s' "$response" | jq -r '.commit.sha')
            test "$expected" = "$actual_blob" || { echo "Source bytes mismatch"; exit 1; }
            verified=$(gh api "repos/$repo/git/commits/$signed_commit" --jq '.verification.verified')
            test "$verified" = true || { echo "Not GitHub Verified"; exit 1; }
            echo "Verified P2 patch: $file"
          done
