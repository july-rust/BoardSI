name: PH-08 Stage 4 private replay safety (public synthetic)
on:
  pull_request:
    paths:
      - "tools/validation/ph08_stage4_gateq_replay.py"
      - "tools/validation/test_ph08_stage4_gateq_replay.py"
      - "docs/validation/m2-g2-ph08-stage4-original-gateq-reexecution.md"
      - ".github/workflows/m2-ph08-stage4-replay-safety.yml"
  push:
    branches:
      - "research/ph08-stage4-replay-hardening"
    paths:
      - "tools/validation/ph08_stage4_gateq_replay.py"
      - "tools/validation/test_ph08_stage4_gateq_replay.py"
      - ".github/workflows/m2-ph08-stage4-replay-safety.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-synthetic:
    name: ph08 Stage4 replay safety (optional public only)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install pinned numerical runtime for public-only tests
        run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Execute public-only safety regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ph08-stage4-safety-evidence
          python -m unittest discover -s tools/validation -p "test_ph08_stage4_gateq_replay.py" -v 2>&1 | tee ph08-stage4-safety-evidence/test.log
          python tools/validation/ph08_private_archive_guard.py
      - name: Record scope and checked-out source
        if: always()
        shell: bash
        run: |
          mkdir -p ph08-stage4-safety-evidence
          printf 'source_sha=%s\nscope=PUBLIC_SYNTHETIC_SAFETY_ONLY\nprivate_original=NOT_RUN\nhistorical_gate_q=FAIL\nphysical_bound=BOUND_NOT_CERTIFIED\n' "$(git rev-parse HEAD)" > ph08-stage4-safety-evidence/context.txt
          sha256sum tools/validation/ph08_stage4_gateq_replay.py tools/validation/test_ph08_stage4_gateq_replay.py > ph08-stage4-safety-evidence/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ph08-stage4-public-safety
          path: ph08-stage4-safety-evidence/
          retention-days: 14
