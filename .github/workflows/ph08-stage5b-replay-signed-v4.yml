name: One-shot signed Stage 5B JSON fail-closed fix
on:
  push:
    branches: [ops/ph08-stage5b-replay-sign-20261017]
    paths: [".github/workflows/ph08-stage5b-replay-signed-v4.yml"]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 92d781ceb3371a20ba4d59f2fdbd3d4b71003e72
          persist-credentials: false
      - name: GitHub signed fix of qualification JSON root guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,pathlib,subprocess,base64
          source="92d781ceb3371a20ba4d59f2fdbd3d4b71003e72"
          previous="7c0036f5901f04bcda0e0c3ebb3c6c838aaab548"
          paths=["tools/validation/ph08_stage5b_original_replay.py",
                 "tools/validation/test_ph08_stage5b_original_replay.py"]
          if subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()!=source:
              raise SystemExit("source mismatch")
          additions=[]
          for name in paths:
              p=pathlib.Path(name)
              if not p.is_file() or p.is_symlink():raise SystemExit("invalid source")
              additions.append({"path":name,"contents":base64.b64encode(p.read_bytes()).decode()})
          q="mutation($input:CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid}}}"
          payload={"query":q,"variables":{"input":{
             "branch":{"repositoryNameWithOwner":"july-rust/BoardSI",
                       "branchName":"publish/ph08-stage5b-replay-verified-20261017"},
             "expectedHeadOid":previous,
             "message":{"headline":"fix(ph08): reject malformed generated qualification roots"},
             "fileChanges":{"additions":additions}}}}
          req=urllib.request.Request("https://api.github.com/graphql",
              data=json.dumps(payload).encode(),method="POST",
              headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                       "Accept":"application/vnd.github+json",
                       "Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=35) as response: d=json.load(response)
          if d.get("errors") or not d.get("data",{}).get("createCommitOnBranch"):
              raise SystemExit("signed publication rejected")
          print("SIGNED_SHA="+d["data"]["createCommitOnBranch"]["commit"]["oid"])
          PY
