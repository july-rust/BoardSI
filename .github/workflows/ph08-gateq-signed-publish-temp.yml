name: TEMP PH-08 Gate Q Verified commit publisher
on:
  push:
    branches: [ops/ph08-gateq-bootstrap-51]
    paths: [.github/workflows/ph08-gateq-signed-publish-temp.yml]
permissions:
  contents: write
jobs:
  publish-verified:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.repository == 'july-rust/BoardSI'
    steps:
      - uses: actions/checkout@v5
      - name: Publish prepared files to clean branch using GitHub-signed GraphQL commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          EXPECTED_MAIN: 484b1953ff0d9e81836bea226e385dc7e8b5d42c
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, urllib.request
          repo = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          expected = os.environ["EXPECTED_MAIN"]
          branch = "feature/ph08-gateq-independent-51"
          paths = [
            "tools/validation/ph08_gateq_independent.py",
            "tools/validation/test_ph08_gateq_independent.py",
            "docs/validation/m2-g2-ph08-gateq-independent-proposed.md",
            ".github/workflows/m2-ph08-gateq-independent.yml",
          ]
          def github(url, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              headers = {"Authorization":"Bearer "+token, "Accept":"application/vnd.github+json",
                         "X-GitHub-Api-Version":"2022-11-28"}
              if data is not None:
                  headers["Content-Type"] = "application/json"
              request = urllib.request.Request(url, data=data, headers=headers)
              with urllib.request.urlopen(request, timeout=40) as response:
                  return json.loads(response.read())
          ref = github("https://api.github.com/repos/"+repo+"/git/ref/heads/"+branch)
          if ref["object"]["sha"] != expected:
              raise RuntimeError("clean branch head differs from expected main; abort")
          if github("https://api.github.com/repos/"+repo+"/git/ref/heads/main")["object"]["sha"] != expected:
              raise RuntimeError("main advanced; manually reconcile before publishing")
          changes = [{"path":p,"contents":base64.b64encode(pathlib.Path(p).read_bytes()).decode("ascii")} for p in paths]
          query = """mutation($input: CreateCommitOnBranchInput!) {
            createCommitOnBranch(input:$input) { commit { oid url } }
          }"""
          inputs = {
            "branch": {"repositoryNameWithOwner":repo,"branchName":branch},
            "message": {"headline":"test(m2): add independent PH-08 Gate Q rational oracle and proposed criteria"},
            "fileChanges": {"additions":changes},
            "expectedHeadOid":expected,
          }
          result = github("https://api.github.com/graphql",{"query":query,"variables":{"input":inputs}})
          if result.get("errors"):
              raise RuntimeError("GraphQL createCommitOnBranch failed: "+str(result["errors"]))
          commit = result["data"]["createCommitOnBranch"]["commit"]
          verified = github("https://api.github.com/repos/"+repo+"/commits/"+commit["oid"])
          signature = verified["commit"]["verification"]
          print(json.dumps({"commit":commit,"signature":signature},sort_keys=True))
          if not signature["verified"]:
              raise RuntimeError("GitHub did not report a Verified signed commit")
          PY
