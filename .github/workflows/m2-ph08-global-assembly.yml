name: PH-08 global HMM assembly (public synthetic)
on:
  pull_request:
    paths:
      - "tools/validation/ph08_uniform_global_assembly.py"
      - "tools/validation/test_ph08_uniform_global_assembly.py"
      - "tools/validation/ph08_uniform_quadratic_identity.py"
      - "tools/validation/ph08_gateq_exact_captured.py"
      - "tools/validation/ph08_private_archive_guard.py"
      - "docs/validation/m2-g2-ph08-global-assembly-diagnostic.md"
      - ".github/workflows/m2-ph08-global-assembly.yml"
  push:
    branches: [main]
    paths:
      - "tools/validation/ph08_uniform_global_assembly.py"
      - "tools/validation/test_ph08_uniform_global_assembly.py"
      - "tools/validation/ph08_uniform_quadratic_identity.py"
      - "tools/validation/ph08_gateq_exact_captured.py"
      - "tools/validation/ph08_private_archive_guard.py"
      - ".github/workflows/m2-ph08-global-assembly.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-global:
    name: ph08 global assembly (optional public synthetic)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Pin numerical dependency
        run: python -m pip install numpy==2.3.5
      - name: Run exact assembly and negative-control tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ph08-global-evidence
          python -m unittest discover -s tools/validation -p 'test_ph08_uniform_global_assembly.py' -v 2>&1 | tee ph08-global-evidence/tests.log
          python tools/validation/ph08_private_archive_guard.py
      - name: Record synthetic-only provenance
        if: always()
        shell: bash
        run: |
          mkdir -p ph08-global-evidence
          printf 'source_sha=%s\nscope=PUBLIC_SYNTHETIC_GLOBAL_ONLY\nprivate_original=NOT_RUN\nhistorical_gate_q=FAIL\nphysical_bound=BOUND_NOT_CERTIFIED\ncontract=NOT_FROZEN\nrust_fem=NO_GO\n' "$GITHUB_SHA" > ph08-global-evidence/context.txt
          sha256sum tools/validation/ph08_uniform_global_assembly.py tools/validation/test_ph08_uniform_global_assembly.py > ph08-global-evidence/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ph08-global-assembly-public-synthetic
          path: ph08-global-evidence/
          retention-days: 14
