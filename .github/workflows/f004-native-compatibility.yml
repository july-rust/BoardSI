name: F004 Native BSI Golden and Migration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: f004-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  reference:
    name: Independent immutable v1 Oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Check independent fixture recipe
        run: |
          python3 -m py_compile tools/validation/f004_reference_fixture.py
          mkdir -p f004-golden
          python3 tools/validation/f004_reference_fixture.py --output f004-golden/reference-v1.bsi
          python3 - <<'PY'
          import hashlib, sqlite3
          from pathlib import Path
          p = Path("f004-golden/reference-v1.bsi")
          with sqlite3.connect(p) as c:
              assert c.execute("PRAGMA user_version").fetchone()[0] == 1
              assert c.execute("PRAGMA integrity_check").fetchone()[0] == "ok"
              assert c.execute("SELECT COUNT(*) FROM geometry").fetchone()[0] == 1
          print("F004_ORACLE_SHA256", hashlib.sha256(p.read_bytes()).hexdigest())
          PY
          python3 tools/validation/f004_verify_frozen.py --compare f004-golden/reference-v1.bsi
      - uses: actions/upload-artifact@v4
        with:
          name: f004-v1-independent-oracle
          path: f004-golden/reference-v1.bsi
          retention-days: 30
          if-no-files-found: error
  native:
    name: F004 Golden + Migration / ${{ matrix.os }}
    needs: reference
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, windows-11-arm, macos-15]
    env:
      F004_GOLDEN_PATH: ${{ github.workspace }}/f004-golden/reference-v1.bsi
    steps:
      - uses: actions/checkout@v5
      - name: Install project toolchain
        run: rustup toolchain install 1.75.0 --profile minimal --component rustfmt
      - uses: actions/download-artifact@v4
        with:
          name: f004-v1-independent-oracle
          path: f004-golden
      - name: Assert Golden and formatting
        shell: bash
        run: |
          test -s f004-golden/reference-v1.bsi
          cargo +1.75.0 fmt --all -- --check
          cargo fetch --locked
      - name: Rust Native cross-OS and F004 independent acceptance
        shell: bash
        run: |
          cargo +1.75.0 test -p boardsi-native --locked --verbose
          cargo +1.75.0 test -p boardsi-native --locked --test f004_golden -- --ignored --nocapture
