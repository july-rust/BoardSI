name: F004 Native BSI Golden and Migration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: f004-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  reference:
    name: Independent immutable v1 Oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Check independent fixture recipe
        run: |
          python3 -m py_compile tools/validation/f004_reference_fixture.py
          mkdir -p f004-golden
          python3 tools/validation/f004_reference_fixture.py --output f004-golden/reference-v1.bsi
          python3 - <<'PY'
          import hashlib, sqlite3
          from pathlib import Path
          p = Path("f004-golden/reference-v1.bsi")
          with sqlite3.connect(p) as c:
              assert c.execute("PRAGMA user_version").fetchone()[0] == 1
              assert c.execute("PRAGMA integrity_check").fetchone()[0] == "ok"
              assert c.execute("SELECT COUNT(*) FROM geometry").fetchone()[0] == 1
          print("F004_ORACLE_SHA256", hashlib.sha256(p.read_bytes()).hexdigest())
          PY
          python3 tools/validation/f004_verify_frozen.py --compare f004-golden/reference-v1.bsi
          python3 tools/validation/f004_reference_material_fixture.py --output f004-golden/material-v1.bsi
          python3 tools/validation/f004_verify_frozen.py --compare f004-golden/reference-v1.bsi --compare-material f004-golden/material-v1.bsi
      - name: Generate one-time all-nine-kinds full-schema Golden (Rust Writer)
        shell: bash
        run: |
          rustup toolchain install 1.75.0 --profile minimal
          F004_FULL_NINE_OUTPUT="${{ github.workspace }}/f004-golden/all-nine-v1.bsi" cargo +1.75.0 test -p boardsi-native --locked --test native all_nine_kinds_in_one_real_sqlite_file -- --exact
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path("f004-golden/all-nine-v1.bsi")
          content = p.read_bytes()
          print(f"F004_ALL_NINE_SHA256={hashlib.sha256(content).hexdigest()} bytes={len(content)}")
          PY
          python3 tools/validation/f004_verify_frozen.py --compare f004-golden/reference-v1.bsi --compare-full f004-golden/all-nine-v1.bsi --compare-material f004-golden/material-v1.bsi
      - uses: actions/upload-artifact@v4
        with:
          name: f004-v1-independent-oracle
          path: f004-golden/*.bsi
          retention-days: 30
          if-no-files-found: error
  native:
    name: F004 Golden + Migration / ${{ matrix.os }}
    needs: reference
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, windows-11-arm, macos-15]
    env:
      F004_GOLDEN_PATH: ${{ github.workspace }}/f004-golden/reference-v1.bsi
      F004_GOLDEN_ALL_NINE_PATH: ${{ github.workspace }}/f004-golden/all-nine-v1.bsi
      F004_GOLDEN_MATERIAL_PATH: ${{ github.workspace }}/f004-golden/material-v1.bsi
    steps:
      - uses: actions/checkout@v5
      - name: Install project toolchain
        run: rustup toolchain install 1.75.0 --profile minimal --component rustfmt
      - uses: actions/download-artifact@v4
        with:
          name: f004-v1-independent-oracle
          path: f004-golden
      - name: Assert Golden and formatting
        shell: bash
        run: |
          test -s f004-golden/reference-v1.bsi
          test -s f004-golden/all-nine-v1.bsi
          test -s f004-golden/material-v1.bsi
          cargo +1.75.0 fmt --all -- --check
          cargo fetch --locked
      - name: Rust Native cross-OS and F004 independent acceptance
        shell: bash
        run: |
          cargo +1.75.0 test -p boardsi-native --locked --verbose
          cargo +1.75.0 test -p boardsi-native --locked --test f004_golden -- --ignored --nocapture
          cargo +1.75.0 test -p boardsi-native --locked --features f003-qualification --test f004_resilience -- --nocapture
  enospc:
    name: F004 actual Linux migration ENOSPC
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - name: Install locked Rust
        run: rustup toolchain install 1.75.0 --profile minimal
      - name: Force actual tmpfs full and protect target
        shell: bash
        run: |
          set -euo pipefail
          FS="$RUNNER_TEMP/f004-enospc"
          mkdir -p "$FS"
          sudo mount -t tmpfs -o size=16m tmpfs "$FS"
          trap 'sudo umount "$FS"' EXIT
          F004_ENOSPC_DIR="$FS" cargo +1.75.0 test --locked -p boardsi-native --features f003-qualification --test f004_resilience actual_tmpfs_enospc_preserves_last_good_migration_target -- --exact --nocapture
