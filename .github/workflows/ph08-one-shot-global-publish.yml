name: PH-08 one-shot verified public global assembly publisher (staging only)
on:
  push:
    branches:
      - feature/ph08-global-assembly-public-diagnostics
    paths:
      - ".github/workflows/ph08-one-shot-global-publish.yml"
permissions:
  contents: write
jobs:
  publish:
    if: "github.repository == 'july-rust/BoardSI' && github.event.head_commit.message == 'ci(ph08): temporary one-shot verified publisher'"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Pin exact reviewed staging parent and test public sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "3035107e15653d4e056ee378cd7cc223ca06f729"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = ".github/workflows/ph08-one-shot-global-publish.yml"
          python -m pip install numpy==2.3.5
          python -m unittest discover -s tools/validation -p 'test_ph08_uniform_global_assembly.py' -v
          python tools/validation/ph08_private_archive_guard.py
      - name: Publish exactly four public reviewed files as GitHub Verified
        shell: bash
        run: |
          set -euo pipefail
          repo=july-rust/BoardSI
          target=feature/ph08-global-assembly-verified
          base=d60fd4d798852aad06c3e1d7c9e48987d88e6751
          actual=$(gh api "repos/$repo/git/ref/heads/$target" --jq '.object.sha')
          test "$actual" = "$base" || { echo "Signed target moved: refusing repeat"; exit 1; }
          for file in \
            tools/validation/ph08_uniform_global_assembly.py \
            tools/validation/test_ph08_uniform_global_assembly.py \
            docs/validation/m2-g2-ph08-global-assembly-diagnostic.md \
            .github/workflows/m2-ph08-global-assembly.yml
          do
            expected=$(git hash-object "$file")
            encoded=$(base64 -w0 "$file")
            response=$(gh api -X PUT "repos/$repo/contents/$file" \
              -f "branch=$target" \
              -f "message=test(ph08): publish verified global synthetic $file" \
              -f "content=$encoded")
            actual_blob=$(printf '%s' "$response" | jq -r '.content.sha')
            signed_commit=$(printf '%s' "$response" | jq -r '.commit.sha')
            test "$expected" = "$actual_blob" || { echo "Blob integrity mismatch"; exit 1; }
            verified=$(gh api "repos/$repo/git/commits/$signed_commit" --jq '.verification.verified')
            test "$verified" = true || { echo "Commit not GitHub Verified"; exit 1; }
            echo "VERIFIED_PUBLIC_FILE $file $signed_commit"
          done
          echo "PUBLISH_PASS four public GitHub-Verified source commits; staging workflow excluded"
