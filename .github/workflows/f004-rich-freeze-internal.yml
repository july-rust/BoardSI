name: F004 Freeze Rich Geometry Golden Once
on:
  push:
    branches: [feat/f004-compatibility-golden]
permissions:
  contents: write
jobs:
  freeze:
    if: github.repository == 'july-rust/BoardSI'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Generate and pin nine-geometry Rust Golden only if absent
        shell: bash
        run: |
          if test -f schemas/bsi/golden-v1-nine-geometry.bsi; then
            sha256sum schemas/bsi/golden-v1-nine-geometry.bsi | awk '{print $1}' | diff - schemas/bsi/golden-v1-nine-geometry.sha256
          else
            rustup toolchain install 1.75.0 --profile minimal
            F004_RICH_GOLDEN_OUTPUT="${{ github.workspace }}/schemas/bsi/golden-v1-nine-geometry.bsi" cargo +1.75.0 test -p boardsi-native --locked --test native all_nine_kinds_in_one_real_sqlite_file -- --exact
            sha256sum schemas/bsi/golden-v1-nine-geometry.bsi | awk '{print $1}' > schemas/bsi/golden-v1-nine-geometry.sha256
          fi
          git add schemas/bsi/golden-v1-nine-geometry.bsi schemas/bsi/golden-v1-nine-geometry.sha256
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "test(F_004): freeze nine-geometry binary Golden"
            git push origin HEAD:refs/heads/feat/f004-compatibility-golden
          fi
