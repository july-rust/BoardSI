name: One-shot signed Stage 5B replay synthetic-test fix
on:
  push:
    branches: [ops/ph08-stage5b-replay-sign-20261017]
    paths: [".github/workflows/ph08-stage5b-replay-signed-v3.yml"]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 75b995033f583bf60f3b60b1c56c1cce588f9958
          persist-credentials: false
      - name: Signed exact test-only correction
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,pathlib,subprocess,base64
          SOURCE="75b995033f583bf60f3b60b1c56c1cce588f9958"
          PREVIOUS="d4b69cc2666fa9b253a665dc797b2e42251318fd"
          name="tools/validation/test_ph08_stage5b_original_replay.py"
          if subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()!=SOURCE:
              raise SystemExit("source SHA mismatch")
          path=pathlib.Path(name)
          if not path.is_file() or path.is_symlink():raise SystemExit("unsafe source")
          q="mutation($input:CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid}}}"
          payload={"query":q,"variables":{"input":{
             "branch":{"repositoryNameWithOwner":"july-rust/BoardSI",
                       "branchName":"publish/ph08-stage5b-replay-verified-20261017"},
             "expectedHeadOid":PREVIOUS,
             "message":{"headline":"test(ph08): isolate replay SHA control from runtime fixture"},
             "fileChanges":{"additions":[{"path":name,
                    "contents":base64.b64encode(path.read_bytes()).decode()}]}}}}
          req=urllib.request.Request("https://api.github.com/graphql",
              data=json.dumps(payload).encode(),method="POST",
              headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                       "Content-Type":"application/json",
                       "Accept":"application/vnd.github+json"})
          with urllib.request.urlopen(req,timeout=35) as response: data=json.load(response)
          if data.get("errors") or not data.get("data",{}).get("createCommitOnBranch"):
              raise SystemExit("GitHub verified publication rejected")
          print("NEW_SIGNED_SHA="+data["data"]["createCommitOnBranch"]["commit"]["oid"])
          PY
