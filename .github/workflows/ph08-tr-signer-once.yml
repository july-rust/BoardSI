name: One-time PH-08 Gate Q Verified public-source publisher
on:
  push:
    branches: ["ops/ph08-tr-signer-20261017"]
    paths: [".github/workflows/ph08-tr-signer-once.yml"]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'july-rust/BoardSI' && github.ref == 'refs/heads/ops/ph08-tr-signer-20261017'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Verify staged Git blobs and publish signed commit through GitHub GraphQL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          repo="july-rust/BoardSI"
          source="765deb31f4fd356c231ccec376dd2c4b2f718588"
          expected="1735922aad63c0426efdad9daf3c0dc3e39054b1"
          branch="feature/ph08-gateq-tr-verified-publish"
          paths={
            ".github/workflows/m2-ph08-gateq-independent.yml":"f9e81213321265f62e3e5c83a12ff05a76f086b7",
            "docs/validation/m2-g2-ph08-gateq-tr-exact-captured-proposed.md":"2f2102da9323f5f6b706a2317cb14fd2d781a464",
            "docs/validation/ph08-gateq-tr-synthetic-prereg-v1.json":"fd4146dfc720a1885902016a5c834387c0cf5c99",
            "tools/validation/ph08_gateq_exact_captured.py":"5a9a1445fd29b5d90fe02646437763404e449a91",
            "tools/validation/test_ph08_gateq_exact_captured.py":"176d817424035a2a8d14d3a46c5162e109f67125",
            "tools/validation/test_ph08_gateq_independent.py":"afff7f065c052fe0d0f4726af1f5789edc4706a2",
          }
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                   "Accept":"application/vnd.github+json",
                   "X-GitHub-Api-Version":"2022-11-28",
                   "User-Agent":"boardsi-ph08-pr60-signed-publisher"}
          def api(url, body=None):
            req=urllib.request.Request(url, data=body, headers=headers)
            with urllib.request.urlopen(req, timeout=45) as resp:
              return json.loads(resp.read())
          current=api("https://api.github.com/repos/"+repo+"/branches/"+branch)
          if current["commit"]["sha"]!=expected:
            raise RuntimeError("signed branch moved; refusing unexpected head")
          additions=[]
          for path, digest in paths.items():
            obj=api("https://api.github.com/repos/"+repo+"/contents/"+path+"?ref="+source)
            if obj.get("type")!="file" or obj.get("encoding")!="base64":
              raise RuntimeError("missing staged file "+path)
            raw=base64.b64decode(obj["content"])
            blob=hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
            if obj["sha"]!=digest or blob!=digest:
              raise RuntimeError("source blob changed or malformed "+path)
            additions.append({"path":path,"contents":base64.b64encode(raw).decode("ascii")})
            print("source_verified_blob="+path+" "+digest)
          mutation="""mutation($input:CreateCommitOnBranchInput!){
            createCommitOnBranch(input:$input){commit{oid url}}
          }"""
          inp={"branch":{"repositoryNameWithOwner":repo,"branchName":branch},
               "message":{"headline":"test(ph08): exact captured arithmetic and fail-closed prospective T/R evidence"},
               "fileChanges":{"additions":additions},"expectedHeadOid":expected}
          response=api("https://api.github.com/graphql",
                       json.dumps({"query":mutation,"variables":{"input":inp}}).encode())
          if "errors" in response:
            raise RuntimeError("signed publish failed: "+repr(response["errors"]))
          commit=response["data"]["createCommitOnBranch"]["commit"]
          print("signed_commit_sha="+commit["oid"])
          print("signed_commit_url="+commit["url"])
          print("staging_source_sha="+source)
          PY
