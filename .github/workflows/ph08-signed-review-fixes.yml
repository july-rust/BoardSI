name: PH08 signed review corrections (one-shot)
on:
  push:
    branches: [ops/ph08-review-fixes-20261016]
permissions:
  contents: write
jobs:
  amend-verified:
    if: github.repository == 'july-rust/BoardSI' && github.ref == 'refs/heads/ops/ph08-review-fixes-20261016'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate P2 fixes and create GitHub-Verified commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import sys
          import tempfile
          import urllib.parse
          import urllib.request
          
          repo = "july-rust/BoardSI"
          target = "test/m2-ph08-evidence-audit-signed-20261016"
          expected = "f8c5241c78a5bf4355ac210c625443eafd235b71"
          known_blobs = {
            "tools/validation/ph08_evidence_audit.py": "b0b9689ce99dbac2579d07cade573ce8a7d2696c",
            "tools/validation/test_ph08_evidence_audit.py": "ce2b0cc648a6a1b9daeee103e939d25519378b8f",
          }
          token = os.environ["GH_TOKEN"]
          base = "https://api.github.com/repos/" + repo
          def request(url, data=None):
              encoded = None if data is None else json.dumps(data, separators=(",", ":")).encode()
              req = urllib.request.Request(url, data=encoded, method="GET" if encoded is None else "POST", headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urllib.request.urlopen(req, timeout=45) as f:
                  return json.load(f)
          
          head = request(base + "/git/ref/heads/" + target)["object"]["sha"]
          assert head == expected, "Ref moved; fail closed"
          files = {}
          for path, known_sha in known_blobs.items():
              item = request(base + "/contents/" + urllib.parse.quote(path, safe="/") + "?ref=" + expected)
              assert item["type"] == "file" and item["sha"] == known_sha, "Source mismatch " + path
              files[path] = base64.b64decode(item["content"]).decode("utf-8")
          
          audit_path = "tools/validation/ph08_evidence_audit.py"
          test_path = "tools/validation/test_ph08_evidence_audit.py"
          old = files[audit_path]
          anchor = "def source_records(manifest: object)"
          helper = '''def reject_duplicate_json_keys(pairs: list[tuple[str, object]]) -> dict:
              """Fail closed if a JSON object repeats a key at any nesting depth."""
              obj = {}
              for key, value in pairs:
                  if key in obj:
                      raise ValueError(f"duplicate JSON object key: {key}")
                  obj[key] = value
              return obj
          
          
          def load_unique_json(raw: bytes) -> object:
              return json.loads(raw, object_pairs_hook=reject_duplicate_json_keys)
          
          
          '''
          assert old.count(anchor) == 1
          new = old.replace(anchor, helper + anchor)
          assert new.count("json.loads(z.read(members[name]))") == 1
          new = new.replace("json.loads(z.read(members[name]))", "load_unique_json(z.read(members[name]))")
          assert new.count("json.loads(z.read(members[manifest_names[0]]))") == 1
          new = new.replace("json.loads(z.read(members[manifest_names[0]]))", "load_unique_json(z.read(members[manifest_names[0]]))")
          files[audit_path] = new
          
          old_test = files[test_path]
          old_entry = "if __name__ == '__main__': unittest.main(verbosity=2)"
          assert old_test.count(old_entry) == 1
          new_test = old_test.replace(old_entry, "")
          extra = '''
          
          
          class DuplicateManifestKeys(unittest.TestCase):
              def test_chat_only_manifest_rejects_duplicate_digest_key(self):
                  with tempfile.TemporaryDirectory() as tmp:
                      path = Path(tmp) / "chat.zip"
                      body = b"synthetic"
                      sha = digest(body)
                      name = "boardsi-ph08-stage5d-manifest.json"
                      raw = ('{"files_sha256":{"sample.txt":"' + sha +
                             '","sample.txt":"' + sha + '"}}').encode()
                      with zipfile.ZipFile(path, "w") as z:
                          z.writestr("sample.txt", body)
                          z.writestr(name, raw)
                      r = inspect(path, expected_sha256=digest(path.read_bytes()))
                      self.assertEqual(r["result"], "FAIL")
                      self.assertTrue(any("manifest JSON" in v for v in r["failures"]))
          
              def test_original_manifest_rejects_duplicate_nested_source_field(self):
                  with tempfile.TemporaryDirectory() as tmp:
                      path = Path(tmp) / "original.zip"
                      body = b"synthetic"
                      source_digest = digest(body)
                      raw = ('{"sources":[{"path":"src/check.py","path":"src/check.py",'
                             '"sha256":"' + source_digest + '"}]}').encode()
                      contents = {"src/check.py": body, "evidence/manifest.json": raw}
                      sums = ''.join(f'{digest(v)}  {k}\\n' for k, v in contents.items()).encode()
                      with zipfile.ZipFile(path, "w") as z:
                          for name, b in contents.items():
                              z.writestr(name, b)
                          z.writestr("SHA256SUMS", sums)
                      r = inspect(path, expected_sha256=digest(path.read_bytes()),
                                  expected_entries=2, expected_sources=1)
                      self.assertEqual(r["result"], "FAIL")
                      self.assertTrue(any("invalid JSON" in v for v in r["failures"]))
          
          
          if __name__ == "__main__":
              unittest.main(verbosity=2)
          '''
          new_test += extra
          files[test_path] = new_test
          
          with tempfile.TemporaryDirectory() as tmp:
              root = pathlib.Path(tmp)
              for name, content in files.items():
                  (root / pathlib.Path(name).name).write_text(content, encoding="utf-8")
              command = [sys.executable, str(root / "test_ph08_evidence_audit.py")]
              result = subprocess.run(command, cwd=root, text=True, capture_output=True)
              print(result.stdout[-1500:])
              print(result.stderr[-2000:])
              assert result.returncode == 0, "Direct unittest failed"
              assert "Ran 24 tests" in result.stderr, "Direct mode must discover all 24 tests"
              result2 = subprocess.run([sys.executable, "-m", "unittest", "discover", "-s", str(root),
                                       "-p", "test_ph08_evidence_audit.py", "-v"],
                                       text=True, capture_output=True)
              print(result2.stderr[-700:])
              assert result2.returncode == 0 and "Ran 24 tests" in result2.stderr, "Discovery failed"
          
          file_changes = [{"path": name, "contents": base64.b64encode(value.encode()).decode()}
                          for name, value in files.items()]
          mutation = '''mutation($input:CreateCommitOnBranchInput!){
            createCommitOnBranch(input:$input){commit{oid url}ref{name}}
          }'''
          payload = {"query": mutation, "variables": {"input": {
              "branch": {"repositoryNameWithOwner": repo, "branchName": target},
              "message": {"headline": "fix(m2): reject duplicate PH-08 manifest keys and execute all tests",
                          "body": "Address two Codex P2 review findings. Use strict JSON object-pair parsing for original and Chat manifests; move unittest entry point below classes, add two negative tests."},
              "fileChanges": {"additions": file_changes},
              "expectedHeadOid": expected,
          }}}
          result = request("https://api.github.com/graphql", payload)
          assert not result.get("errors"), result.get("errors")
          created = result["data"]["createCommitOnBranch"]["commit"]
          print("SIGNED_REVIEW_FIX", created["oid"], created["url"])
          
          PY
