name: One-time PH08 signed HMM bridge commit
on:
  push:
    branches:
      - ops/ph08-hmm-bridge-signer-20261016
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'july-rust/BoardSI'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: GitHub native signed GraphQL commit and cleanup
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          q='mutation($input:CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid url}}}'
          files=[{"path":"tools/validation/ph08_gateq_hmm_bridge.py","contents":""},{"path":"tools/validation/test_ph08_gateq_hmm_bridge.py","contents":""},{"path":"docs/validation/m2-g2-ph08-hmm-bridge-proposed.md","contents":""},{"path":".github/workflows/m2-ph08-hmm-bridge.yml","contents":""}]
          def post(input):
              raw=json.dumps({'query':q,'variables':{'input':input}}).encode()
              req=urllib.request.Request('https://api.github.com/graphql',raw,
                  headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=50) as r:obj=json.load(r)
              if obj.get('errors'):raise RuntimeError(str(obj['errors']))
              return obj['data']['createCommitOnBranch']['commit']['oid']
          sha=post({'branch':{'repositoryNameWithOwner':'july-rust/BoardSI','branchName':'feature/ph08-gateq-hmm-oracle-bridge'},
                    'message':{'headline':'test(m2): original HMM recovery probe and independent rational operator diagnostics'},
                    'expectedHeadOid':'8e79b7e0502348af628cfa3a7e08915a577e773d',
                    'fileChanges':{'additions':files}})
          print('VERIFIED_FEATURE_SHA='+sha)
          done=post({'branch':{'repositoryNameWithOwner':'july-rust/BoardSI','branchName':'ops/ph08-hmm-bridge-signer-20261016'},
                     'message':{'headline':'chore: remove one-off PH08 publishing workflow'},
                     'expectedHeadOid':os.environ['GITHUB_SHA'],
                     'fileChanges':{'deletions':[{'path':'.github/workflows/ph08-one-shot-signed-publisher.yml'}]}})
          print('CLEANED_OPS_SHA='+done)
          PY
