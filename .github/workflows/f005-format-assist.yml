name: F005 temporary rustfmt diff
on:
  push:
    branches: [feat/f005-cad-bsi-roundtrip]
  workflow_dispatch:
jobs:
  rustfmt-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Emit formatting-only patch
        run: |
          cargo fmt --all
          git diff --color=never -- crates/boardsi-native/src/lib.rs crates/boardsi-import/src/odb_qt_wire.rs crates/boardsi-import/src/bin/boardsi-odb-qt-import.rs apps/boardsi-native-file/src/main.rs apps/boardsi-native-file/tests/f005_cad_roundtrip.rs
