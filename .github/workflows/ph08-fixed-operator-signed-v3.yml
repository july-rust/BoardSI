name: One-shot PH-08 Git object archive-guard signed v3
on:
  push:
    branches: [ops/ph08-fixed-operator-signer-20261017]
    paths: [".github/workflows/ph08-fixed-operator-signed-v3.yml"]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 411f0590b19aee3902513f0033394c8ca70d807b
          persist-credentials: false
      - name: Publish exact Git-index guard fix as GitHub Verified
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,base64,pathlib,subprocess,urllib.request
          source="411f0590b19aee3902513f0033394c8ca70d807b"
          expected_tree="10653140ae9a817789a9e0862eff0ba881f95dbb"
          previous="fc1dee888be6e97eaa30f9f4bd1db3872660cd7a"
          paths=[
            "tools/validation/ph08_private_archive_guard.py",
            "tools/validation/test_ph08_private_archive_guard.py",
            "docs/validation/m2-g2-ph08-fixed-operator-error-budget.md",
          ]
          if subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()!=source:
              raise SystemExit("SOURCE_SHA_MISMATCH")
          if subprocess.check_output(["git","rev-parse","HEAD^{tree}"],text=True).strip()!=expected_tree:
              raise SystemExit("SOURCE_TREE_MISMATCH")
          addition=[]
          for path in paths:
              p=pathlib.Path(path)
              if not p.is_file() or p.is_symlink():raise SystemExit("SOURCE_INVENTORY_MISMATCH")
              addition.append({"path":path,"contents":base64.b64encode(p.read_bytes()).decode()})
          q="mutation($input:CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid}}}"
          payload={"query":q,"variables":{"input":{
              "branch":{"repositoryNameWithOwner":"july-rust/BoardSI",
                        "branchName":"publish/ph08-fixed-operator-verified-20261017"},
              "expectedHeadOid":previous,
              "message":{"headline":"fix(ph08): hash immutable Git index blobs in required private ZIP guard"},
              "fileChanges":{"additions":addition}}}}
          req=urllib.request.Request("https://api.github.com/graphql",method="POST",
              data=json.dumps(payload).encode(),
              headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                       "Accept":"application/vnd.github+json","Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=40) as response:
              result=json.load(response)
          if result.get("errors") or not result.get("data",{}).get("createCommitOnBranch"):
              raise SystemExit("GITHUB_VERIFIED_PUBLISH_REFUSED")
          print("SIGNED_SHA="+result["data"]["createCommitOnBranch"]["commit"]["oid"])
          PY
