      - name: Validate M0-only F1 native case-specific technology evidence
        # Always preserve an explicit failing proof if native Qt execution
        # OR verifier-adversarial tests failed (unless job was cancelled).
        if: ${{ !cancelled() }}
        shell: bash
        env:
          BOARDSI_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BOARDSI_NATIVE_QT_EXECUTION_OUTCOME: ${{ steps.native_qt_execution.outcome }}
          BOARDSI_F1_ADVERSARIAL_TESTS_OUTCOME: ${{ steps.f1_adversarial_tests.outcome }}
        run: |
          set -euo pipefail
          python .github/scripts/m0_f1_native_subcases.py \
            build-qt/qt-runtime-results.json \
            "$RUNNER_TEMP/m0-f1-native-subcases.json" \
            '${{ matrix.platform }}' \
