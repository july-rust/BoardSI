name: Qt runtime
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qt-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-qt:
    name: Linux x86_64 Qt 6.8.3 offscreen (provisional)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install Qt build prerequisites
        run: sudo apt-get update && sudo apt-get install -y libgl-dev libopengl-dev libegl1 libxkbcommon-dev libvulkan-dev xvfb libxcb-cursor0 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-icccm4 libxkbcommon-x11-0 libx11-xcb1 libxcb-randr0 libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 libxcb-shm0
      - name: Install fixed Qt SDK and CMake
        run: |
          python3 -m venv "$RUNNER_TEMP/qt-tools"
          "$RUNNER_TEMP/qt-tools/bin/pip" install aqtinstall==3.3.0 cmake==3.31.6
          "$RUNNER_TEMP/qt-tools/bin/aqt" install-qt linux desktop 6.8.3 linux_gcc_64 --archives qtbase icu -O "$RUNNER_TEMP/qt"
          echo "$RUNNER_TEMP/qt-tools/bin" >> "$GITHUB_PATH"
          echo "QT_PREFIX=$RUNNER_TEMP/qt/6.8.3/gcc_64" >> "$GITHUB_ENV"
      - name: Build unchanged Rust Worker
        run: |
          rustup toolchain install 1.75.0 --profile minimal
          cargo +1.75.0 build --locked -p boardsi-worker
          cargo +1.75.0 build --locked -p boardsi-import --bin boardsi-import-artwork
          mkdir -p build-qt
          cargo +1.75.0 run --locked -p boardsi-worker --example m0_model_snapshot_fixture -- build-qt/qt-model-a.frame build-qt/qt-model-b.frame
      - name: Build actual Widgets GUI and runtime harness
        run: |
          test "$RUNNER_ARCH" = X64
          "$QT_PREFIX/bin/qmake" -query QT_VERSION
          cmake --version
          g++ --version
          cmake -S apps/boardsi-qt-prototype -B build-qt -DCMAKE_PREFIX_PATH="$QT_PREFIX" -DBOARDSI_WORKER="$GITHUB_WORKSPACE/target/debug/boardsi-worker" -DCMAKE_BUILD_TYPE=Release -DBOARDSI_IMPORTER="$GITHUB_WORKSPACE/target/debug/boardsi-import-artwork"
          cmake --build build-qt --parallel 2
      - name: Run real QApplication and independent Worker
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ulimit -c 0
          export LD_LIBRARY_PATH="$QT_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          ctest --test-dir build-qt --output-on-failure
      - name: Print measurement evidence
        if: always()
        run: |
          if test -f build-qt/qt-runtime-results.json; then cat build-qt/qt-runtime-results.json; fi
          if test -f build-qt/Testing/Temporary/LastTest.log; then cat build-qt/Testing/Temporary/LastTest.log; fi
      - name: Execute xcb desktop backend with software display
        env:
          BOARDSI_EXPECTED_QT_ARCH: x86_64
          BOARDSI_EXPECTED_WORKER_ARCH: x86_64
          BOARDSI_EXPECTED_QT_PLATFORM: xcb
        run: |
          ulimit -c 0
          export LD_LIBRARY_PATH="$QT_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          ldd "$QT_PREFIX/plugins/platforms/libqxcb.so" > build-qt/xcb-dependencies.txt
          cat build-qt/xcb-dependencies.txt
          if grep -q 'not found' build-qt/xcb-dependencies.txt; then exit 1; fi
          cd build-qt
          xvfb-run -a env QT_QPA_PLATFORM=xcb ./boardsi-qt-runtime-validation "$GITHUB_WORKSPACE/target/debug/boardsi-worker" "$(command -v python3)" "$GITHUB_WORKSPACE/apps/boardsi-qt-prototype/tests/fault_worker.py"
  native-qt:
    name: Qt native ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2022
            host: windows
            qt_arch: win64_msvc2022_64
            target: x86_64-pc-windows-msvc
            qt_cpu: x86_64
            rust_cpu: x86_64
            runner_arch: X64
            vc_arch: x64
            platform: windows
            python_arch: x64
          - name: Windows ARM64
            runner: windows-11-arm
            host: windows
            qt_arch: win64_msvc2022_arm64_cross_compiled
            target: aarch64-pc-windows-msvc
            qt_cpu: arm64
            rust_cpu: aarch64
            runner_arch: ARM64
            vc_arch: arm64
            platform: windows
            python_arch: x64
          - name: macOS ARM64
            runner: macos-14
            host: mac
            qt_arch: clang_64
            target: aarch64-apple-darwin
            qt_cpu: arm64
            rust_cpu: aarch64
            runner_arch: ARM64
            platform: cocoa
            python_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      BOARDSI_EXPECTED_QT_ARCH: ${{ matrix.qt_cpu }}
      BOARDSI_EXPECTED_WORKER_ARCH: ${{ matrix.rust_cpu }}
      BOARDSI_EXPECTED_QT_PLATFORM: ${{ matrix.platform }}
      QT_QPA_PLATFORM: ${{ matrix.platform }}
      RUSTUP_TOOLCHAIN: 1.75.0-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Test the exact PR source commit; otherwise the F1 SHA/CI proof
          # would describe a synthetic merge-ref instead of its claimed HEAD.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python_arch }}
      - name: Install fixed Qt SDK
        shell: bash
        run: |
          test "$RUNNER_ARCH" = '${{ matrix.runner_arch }}'
          python -m pip install aqtinstall==3.3.0
          python .github/scripts/install_qt_runtime.py '${{ matrix.host }}' '${{ matrix.qt_arch }}'
      - name: Build matching Rust executable
        shell: bash
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustc -vV
          cargo build --locked -p boardsi-worker
          cargo build --locked -p boardsi-import --bin boardsi-import-artwork
          mkdir -p build-qt
          cargo run --locked -p boardsi-worker --example m0_model_snapshot_fixture -- build-qt/qt-model-a.frame build-qt/qt-model-b.frame
      - name: Build Windows target with installed MSVC toolset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = & $vswhere -latest -products '*' -property installationPath
          if (-not $vsInstall) { throw 'MSVC installation not found' }
          $nativeBuildScript = Join-Path $env:RUNNER_TEMP 'boardsi-build-qt.cmd'
          $hostArg = ''
          if ($env:QT_HOST_PREFIX) { $hostArg = "-DQT_HOST_PATH=`"$env:QT_HOST_PREFIX`"" }
          @(
            "@call `"$vsInstall\Common7\Tools\VsDevCmd.bat`" -arch=${{ matrix.vc_arch }} -host_arch=${{ matrix.vc_arch }}",
            'if errorlevel 1 exit /b 1',
            'where cl',
            'cmake --version',
            "cmake -S apps/boardsi-qt-prototype -B build-qt -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=`"$env:QT_PREFIX`" $hostArg -DBOARDSI_WORKER=`"$env:GITHUB_WORKSPACE/target/debug/boardsi-worker.exe`"",
            'if errorlevel 1 exit /b 1',
            'cmake --build build-qt --parallel 2',
            'if errorlevel 1 exit /b 1'
          ) | Set-Content $nativeBuildScript
          & cmd /c $nativeBuildScript
          if ($LASTEXITCODE -ne 0) { throw "Native Qt build failed: $LASTEXITCODE" }
      - name: Build macOS arm64 target
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cmake --version
          clang++ --version
          cmake -S apps/boardsi-qt-prototype -B build-qt -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_PREFIX_PATH="$QT_PREFIX" -DBOARDSI_WORKER="$GITHUB_WORKSPACE/target/debug/boardsi-worker"
          cmake --build build-qt --parallel 2
          file build-qt/boardsi-qt-runtime-validation target/debug/boardsi-worker
      - name: Execute actual native Qt backend
        id: native_qt_execution
        shell: bash
        run: |
          ulimit -c 0 || true
          cd build-qt
          suffix=''
          if test '${{ runner.os }}' = Windows; then suffix='.exe'; fi
          pythonPath=$(python -c 'import sys; print(sys.executable)')
          ./boardsi-qt-runtime-validation$suffix "$GITHUB_WORKSPACE/target/debug/boardsi-worker$suffix" "$pythonPath" "$GITHUB_WORKSPACE/apps/boardsi-qt-prototype/tests/fault_worker.py"
          ./boardsi-qt-model-v2$suffix --selftest "$GITHUB_WORKSPACE/target/debug/boardsi-worker$suffix" "$GITHUB_WORKSPACE/build-qt/qt-model-a.frame" "$GITHUB_WORKSPACE/build-qt/qt-model-b.frame"
          BOARDSI_SOURCE_HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}" ./boardsi-preview-p0$suffix --selftest "$GITHUB_WORKSPACE/target/debug/boardsi-worker$suffix" "$GITHUB_WORKSPACE/build-qt/qt-model-a.frame" "$GITHUB_WORKSPACE/build-qt/qt-model-b.frame"
          BOARDSI_SOURCE_HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}" ./boardsi-preview-p0$suffix --selftest "$GITHUB_WORKSPACE/target/debug/boardsi-worker$suffix" "$GITHUB_WORKSPACE/build-qt/qt-model-a.frame" "$GITHUB_WORKSPACE/build-qt/qt-model-b.frame" "$GITHUB_WORKSPACE/target/debug/boardsi-import-artwork$suffix" "$GITHUB_WORKSPACE/crates/boardsi-import/tests/fixtures/pads_route_straight_v94.asc"
          cat qt-preview-p0-results.json
      - name: Exercise Windows x64 developer desktop launcher
        if: matrix.name == 'Windows x64'
        shell: pwsh
        env:
          BOARDSI_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $nativeReceipt = 'build-qt/qt-preview-p0-results.json'
          $directReceipt = 'build-qt/qt-preview-native-direct.json'
          if (-not (Test-Path -PathType Leaf $nativeReceipt)) {
            throw 'Missing direct native GUI smoke receipt'
          }
          Move-Item -LiteralPath $nativeReceipt -Destination $directReceipt -Force
          ./scripts/run-boardsi-preview-windows-x64.ps1 -SelfTest
          if (-not (Test-Path -PathType Leaf $nativeReceipt)) {
            throw 'Missing developer launcher GUI smoke receipt'
          }
          $receipt = Get-Content -LiteralPath $nativeReceipt -Raw | ConvertFrom-Json
          if ($receipt.pass -ne $true -or $receipt.p2a_imported_artwork -ne $true -or
              $receipt.p2a_properties_source_isolation_verified -ne $true -or
              $receipt.p2a_import_summary_counts_verified -ne $true -or
              $receipt.p2a_import_failure_recovery_verified -ne $true -or
              $receipt.source_sha -ne $env:BOARDSI_SOURCE_HEAD_SHA) {
            throw 'Developer launcher receipt does not prove current-HEAD P2-A source-isolation smoke'
          }
      - name: Stage Windows x64 developer-only executables (without Qt DLLs)
        if: matrix.name == 'Windows x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = 'build-qt/boardsi-preview-windows-x64-dev'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $items = @{
            'build-qt/boardsi-preview-p0.exe' = 'boardsi-preview-p0.exe'
            'target/debug/boardsi-worker.exe' = 'boardsi-worker.exe'
            'target/debug/boardsi-import-artwork.exe' = 'boardsi-import-artwork.exe'
            'build-qt/qt-model-a.frame' = 'qt-model-a.frame'
            'build-qt/qt-model-b.frame' = 'qt-model-b.frame'
            'crates/boardsi-import/tests/fixtures/pads_route_straight_v94.asc' = 'public-pads-v94-synthetic.asc'
          }
          foreach ($source in $items.Keys) {
            if (-not (Test-Path -PathType Leaf $source)) { throw "Missing developer artifact input: $source" }
            Copy-Item -LiteralPath $source -Destination (Join-Path $stage $items[$source])
          }
          # Ship exactly the same reviewed launcher that native CI executes.
          Copy-Item -LiteralPath 'scripts/run-boardsi-preview-windows-x64.ps1' -Destination (Join-Path $stage 'run-preview.ps1')
          @'
          BoardSI P2-A Windows x64 DEVELOPER BUILD - NOT A GENERAL RELEASE
          1. Extract all files to the same directory (including the two model frames).
          2. Separately install Qt 6.8.3 MSVC 2022 x64 SDK and any required MSVC runtime.
          3. In Windows x64 PowerShell, set QT_PREFIX to the Qt SDK root directory:
             $env:QT_PREFIX = 'C:\path\to\Qt\6.8.3\msvc2022_64'
          4. Verify installation: .\run-preview.ps1 -ValidateOnly
          5. Run synthetic native smoke: .\run-preview.ps1 -SelfTest
             (writes qt-preview-p0-results.json; this is not a vendor PCB test)
          6. Launch the actual Qt GUI: .\run-preview.ps1
             Open PCB -> choose a restricted V9.4 MILS PADS ASCII file (*.asc).
          The viewer accepts only straight routed traces of a supported subset,
          NOT pads, vias, copper pours, connectivity, layer materials or physical SI.
          Declared layers are NOT equivalent to layers containing imported copper.
          No Qt DLLs, Qt plugins, company CAD data, installer, or solver are included.
          SHA256SUMS.txt covers the eight original payloads, not subsequently
          generated selftest receipts. Verify before running. License approval,
          vendor PADS compatibility and general redistribution remain NOT_VERIFIED.
          '@ | Set-Content -LiteralPath (Join-Path $stage 'README.txt') -Encoding UTF8
          # Take a stable payload snapshot BEFORE opening the manifest.
          $payload = @(Get-ChildItem -LiteralPath $stage -File |
            Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | Sort-Object Name)
          if ($payload.Count -ne 8) { throw 'Unexpected developer artifact payload count' }
          $hashLines = @($payload | ForEach-Object {
            ('{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash, $_.Name)
          })
          $manifest = Join-Path $stage 'SHA256SUMS.txt'
          $hashLines | Set-Content -LiteralPath $manifest -Encoding ascii
          foreach ($line in (Get-Content -LiteralPath $manifest)) {
            $parts = $line -split '  ', 2
            if ($parts.Count -ne 2 -or $parts[0].Length -ne 64 -or
                $parts[0] -match '[^A-Fa-f0-9]') {
              throw 'Malformed SHA256 manifest entry'
            }
            $filePath = Join-Path $stage $parts[1]
            $actual = (Get-FileHash -LiteralPath $filePath -Algorithm SHA256).Hash
            if ($actual -ne $parts[0]) {
              throw ('Checksum mismatch: ' + $filePath)
            }
          }
      - name: Exercise Windows x64 unpacked developer artifact against installed Qt SDK
        if: matrix.name == 'Windows x64'
        shell: pwsh
        env:
          BOARDSI_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = 'build-qt/boardsi-preview-windows-x64-dev'
          $runner = Join-Path $stage 'run-preview.ps1'
          & $runner -ValidateOnly
          # The last receipt came from the source-tree launcher. Keep both proofs.
          $receiptPath = 'build-qt/qt-preview-p0-results.json'
          if (-not (Test-Path -LiteralPath $receiptPath -PathType Leaf)) {
            throw 'Source-tree launcher receipt missing'
          }
          Move-Item -LiteralPath $receiptPath -Destination 'build-qt/qt-preview-source-launcher.json' -Force
          # Execute the relocated staged binary from a separate CWD so the
          # archived payload stays exactly covered by its SHA256 manifest.
          & $runner -SelfTest -EvidenceDirectory 'build-qt'
          if (-not (Test-Path -LiteralPath $receiptPath -PathType Leaf)) {
            throw 'Unpacked artifact native smoke receipt missing'
          }
          $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
          if ($receipt.pass -ne $true -or $receipt.p2a_imported_artwork -ne $true -or
              $receipt.p2a_properties_source_isolation_verified -ne $true -or
              $receipt.p2a_import_summary_counts_verified -ne $true -or
              $receipt.p2a_import_failure_recovery_verified -ne $true -or
              $receipt.source_sha -ne $env:BOARDSI_SOURCE_HEAD_SHA) {
            throw 'Unpacked artifact does not prove current-HEAD native P2-A smoke'
          }
          Copy-Item -LiteralPath $receiptPath -Destination 'build-qt/qt-preview-staged-package.json'
          $payload = @(Get-ChildItem -LiteralPath $stage -File |
            Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | Sort-Object Name)
          if ($payload.Count -ne 8) { throw 'Unexpected staged payload after execution' }
          foreach ($line in (Get-Content -LiteralPath (Join-Path $stage 'SHA256SUMS.txt'))) {
            $parts = $line -split '  ', 2
            if ($parts.Count -ne 2 -or $parts[0].Length -ne 64 -or
                $parts[0] -match '[^A-Fa-f0-9]') { throw 'Malformed staged SHA256 manifest' }
            $actual = (Get-FileHash -LiteralPath (Join-Path $stage $parts[1]) -Algorithm SHA256).Hash
            if ($actual -ne $parts[0]) { throw ('Unpacked artifact checksum mismatch: ' + $parts[1]) }
          }
      - name: Upload Windows x64 developer-only executable artifact
        if: matrix.name == 'Windows x64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: boardsi-preview-p2a-windows-x64-dev
          path: build-qt/boardsi-preview-windows-x64-dev/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve developer Preview P0 native execution evidence (not a distributable binary)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: boardsi-preview-p0-native-${{ matrix.name }}
          path: |
            build-qt/qt-preview-p0-results.json
            build-qt/qt-preview-native-direct.json
            build-qt/qt-preview-source-launcher.json
            build-qt/qt-preview-staged-package.json
          if-no-files-found: warn
      - name: Exercise adversarial F1 verifier tests
        id: f1_adversarial_tests
        if: ${{ !cancelled() }}
        shell: bash
        run: python -m unittest discover -s .github/scripts -p 'test_m0_f1_native_subcases.py' -v
      - name: Validate M0-only F1 native case-specific technology evidence
        # Always preserve an explicit failing proof if native Qt execution
        # OR verifier-adversarial tests failed (unless job was cancelled).
        if: ${{ !cancelled() }}
        shell: bash
        env:
          BOARDSI_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BOARDSI_NATIVE_QT_EXECUTION_OUTCOME: ${{ steps.native_qt_execution.outcome }}
          BOARDSI_F1_ADVERSARIAL_TESTS_OUTCOME: ${{ steps.f1_adversarial_tests.outcome }}
        run: |
          set -euo pipefail
          python .github/scripts/m0_f1_native_subcases.py \
            build-qt/qt-runtime-results.json \
            "$RUNNER_TEMP/m0-f1-native-subcases.json" \
            '${{ matrix.platform }}' \
            '${{ matrix.qt_cpu }}'
      - name: Preserve bounded per-case native proof (including failed checks)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m0-f1-native-subcases-${{ matrix.name }}
          path: ${{ runner.temp }}/m0-f1-native-subcases.json
          if-no-files-found: warn
      - name: Print native measurement evidence
        if: always()
        shell: bash
        run: |
          if test -f build-qt/qt-runtime-results.json; then cat build-qt/qt-runtime-results.json; fi
