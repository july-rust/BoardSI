name: Qt runtime
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qt-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-qt:
    name: Linux x86_64 Qt 6.8.3 offscreen (provisional)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install Qt build prerequisites
        run: sudo apt-get update && sudo apt-get install -y libgl-dev libopengl-dev libegl1 libxkbcommon-dev libvulkan-dev xvfb libxcb-cursor0 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-icccm4 libxkbcommon-x11-0 libx11-xcb1 libxcb-randr0 libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 libxcb-shm0
      - name: Install fixed Qt SDK and CMake
        run: |
          python3 -m venv "$RUNNER_TEMP/qt-tools"
          "$RUNNER_TEMP/qt-tools/bin/pip" install aqtinstall==3.3.0 cmake==3.31.6
          "$RUNNER_TEMP/qt-tools/bin/aqt" install-qt linux desktop 6.8.3 linux_gcc_64 --archives qtbase icu -O "$RUNNER_TEMP/qt"
          echo "$RUNNER_TEMP/qt-tools/bin" >> "$GITHUB_PATH"
          echo "QT_PREFIX=$RUNNER_TEMP/qt/6.8.3/gcc_64" >> "$GITHUB_ENV"
      - name: Build unchanged Rust Worker
        run: |
          rustup toolchain install 1.75.0 --profile minimal
          cargo +1.75.0 build --locked -p boardsi-worker
          cargo +1.75.0 build --locked -p boardsi-import --bin boardsi-import-artwork
          mkdir -p build-qt
          cargo +1.75.0 run --locked -p boardsi-worker --example m0_model_snapshot_fixture -- build-qt/qt-model-a.frame build-qt/qt-model-b.frame
      - name: Build actual Widgets GUI and runtime harness
        run: |
          test "$RUNNER_ARCH" = X64
          "$QT_PREFIX/bin/qmake" -query QT_VERSION
          cmake --version
          g++ --version
          cmake -S apps/boardsi-qt-prototype -B build-qt -DCMAKE_PREFIX_PATH="$QT_PREFIX" -DBOARDSI_WORKER="$GITHUB_WORKSPACE/target/debug/boardsi-worker" -DCMAKE_BUILD_TYPE=Release -DBOARDSI_IMPORTER="$GITHUB_WORKSPACE/target/debug/boardsi-import-artwork"
          cmake --build build-qt --parallel 2
      - name: Run real QApplication and independent Worker
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ulimit -c 0
          export LD_LIBRARY_PATH="$QT_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          ctest --test-dir build-qt --output-on-failure
      - name: Print measurement evidence
        if: always()
        run: |
          if test -f build-qt/qt-runtime-results.json; then cat build-qt/qt-runtime-results.json; fi
          if test -f build-qt/Testing/Temporary/LastTest.log; then cat build-qt/Testing/Temporary/LastTest.log; fi
      - name: Execute xcb desktop backend with software display
        env:
          BOARDSI_EXPECTED_QT_ARCH: x86_64
          BOARDSI_EXPECTED_WORKER_ARCH: x86_64
          BOARDSI_EXPECTED_QT_PLATFORM: xcb
        run: |
          ulimit -c 0
          export LD_LIBRARY_PATH="$QT_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          ldd "$QT_PREFIX/plugins/platforms/libqxcb.so" > build-qt/xcb-dependencies.txt
          cat build-qt/xcb-dependencies.txt
          if grep -q 'not found' build-qt/xcb-dependencies.txt; then exit 1; fi
          cd build-qt
          xvfb-run -a env QT_QPA_PLATFORM=xcb ./boardsi-qt-runtime-validation "$GITHUB_WORKSPACE/target/debug/boardsi-worker" "$(command -v python3)" "$GITHUB_WORKSPACE/apps/boardsi-qt-prototype/tests/fault_worker.py"
  native-qt:
    name: Qt native ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2022
            host: windows
            qt_arch: win64_msvc2022_64
            target: x86_64-pc-windows-msvc
            qt_cpu: x86_64
            rust_cpu: x86_64
            runner_arch: X64
            vc_arch: x64
            platform: windows
            python_arch: x64
          - name: Windows ARM64
            runner: windows-11-arm
            host: windows
            qt_arch: win64_msvc2022_arm64_cross_compiled
            target: aarch64-pc-windows-msvc
            qt_cpu: arm64
            rust_cpu: aarch64
            runner_arch: ARM64
            vc_arch: arm64
            platform: windows
            python_arch: x64
          - name: macOS ARM64
            runner: macos-14
            host: mac
            qt_arch: clang_64
            target: aarch64-apple-darwin
            qt_cpu: arm64
            rust_cpu: aarch64
            runner_arch: ARM64
            platform: cocoa
            python_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      BOARDSI_EXPECTED_QT_ARCH: ${{ matrix.qt_cpu }}
      BOARDSI_EXPECTED_WORKER_ARCH: ${{ matrix.rust_cpu }}
      BOARDSI_EXPECTED_QT_PLATFORM: ${{ matrix.platform }}
      QT_QPA_PLATFORM: ${{ matrix.platform }}
      RUSTUP_TOOLCHAIN: 1.75.0-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Test the exact PR source commit; otherwise the F1 SHA/CI proof
          # would describe a synthetic merge-ref instead of its claimed HEAD.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python_arch }}
      - name: Install fixed Qt SDK
        shell: bash
        run: |
          test "$RUNNER_ARCH" = '${{ matrix.runner_arch }}'
          python -m pip install aqtinstall==3.3.0
          python .github/scripts/install_qt_runtime.py '${{ matrix.host }}' '${{ matrix.qt_arch }}'
      - name: Build matching Rust executable
        shell: bash
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustc -vV
          cargo build --locked -p boardsi-worker
          cargo build --locked -p boardsi-import --bin boardsi-import-artwork
          mkdir -p build-qt
          cargo run --locked -p boardsi-worker --example m0_model_snapshot_fixture -- build-qt/qt-model-a.frame build-qt/qt-model-b.frame
      - name: Build Windows target with installed MSVC toolset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = & $vswhere -latest -products '*' -property installationPath
          if (-not $vsInstall) { throw 'MSVC installation not found' }
          $nativeBuildScript = Join-Path $env:RUNNER_TEMP 'boardsi-build-qt.cmd'
          $hostArg = ''
          if ($env:QT_HOST_PREFIX) { $hostArg = "-DQT_HOST_PATH=`"$env:QT_HOST_PREFIX`"" }
          @(
            "@call `"$vsInstall\Common7\Tools\VsDevCmd.bat`" -arch=${{ matrix.vc_arch }} -host_arch=${{ matrix.vc_arch }}",
            'if errorlevel 1 exit /b 1',
            'where cl',
            'cmake --version',
            "cmake -S apps/boardsi-qt-prototype -B build-qt -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=`"$env:QT_PREFIX`" $hostArg -DBOARDSI_WORKER=`"$env:GITHUB_WORKSPACE/target/debug/boardsi-worker.exe`"",
            'if errorlevel 1 exit /b 1',
            'cmake --build build-qt --parallel 2',
            'if errorlevel 1 exit /b 1'
          ) | Set-Content $nativeBuildScript
          & cmd /c $nativeBuildScript
          if ($LASTEXITCODE -ne 0) { throw "Native Qt build failed: $LASTEXITCODE" }
      - name: Build macOS arm64 target
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cmake --version
          clang++ --version
          cmake -S apps/boardsi-qt-prototype -B build-qt -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_PREFIX_PATH="$QT_PREFIX" -DBOARDSI_WORKER="$GITHUB_WORKSPACE/target/debug/boardsi-worker"
          cmake --build build-qt --parallel 2
          file build-qt/boardsi-qt-runtime-validation target/debug/boardsi-worker
      - name: Execute actual native Qt backend
        id: native_qt_execution
        shell: bash
        run: |
          ulimit -c 0 || true
          cd build-qt
          suffix=''
          if test '${{ runner.os }}' = Windows; then suffix='.exe'; fi
          pythonPath=$(python -c 'import sys; print(sys.executable)')
          ./boardsi-qt-runtime-validation$suffix "$GITHUB_WORKSPACE/target/debug/boardsi-worker$suffix" "$pythonPath" "$GITHUB_WORKSPACE/apps/boardsi-qt-prototype/tests/fault_worker.py"
          ./boardsi-qt-model-v2$suffix --selftest "$GITHUB_WORKSPACE/target/debug/boardsi-worker$suffix" "$GITHUB_WORKSPACE/build-qt/qt-model-a.frame" "$GITHUB_WORKSPACE/build-qt/qt-model-b.frame"
          BOARDSI_SOURCE_HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}" ./boardsi-preview-p0$suffix --selftest "$GITHUB_WORKSPACE/target/debug/boardsi-worker$suffix" "$GITHUB_WORKSPACE/build-qt/qt-model-a.frame" "$GITHUB_WORKSPACE/build-qt/qt-model-b.frame"
          BOARDSI_SOURCE_HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}" ./boardsi-preview-p0$suffix --selftest "$GITHUB_WORKSPACE/target/debug/boardsi-worker$suffix" "$GITHUB_WORKSPACE/build-qt/qt-model-a.frame" "$GITHUB_WORKSPACE/build-qt/qt-model-b.frame" "$GITHUB_WORKSPACE/target/debug/boardsi-import-artwork$suffix" "$GITHUB_WORKSPACE/crates/boardsi-import/tests/fixtures/pads_route_straight_v94.asc"
          BOARDSI_SOURCE_HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}" ./boardsi-preview-p0$suffix --via-selftest "$GITHUB_WORKSPACE/target/debug/boardsi-worker$suffix" "$GITHUB_WORKSPACE/build-qt/qt-model-a.frame" "$GITHUB_WORKSPACE/build-qt/qt-model-b.frame" "$GITHUB_WORKSPACE/target/debug/boardsi-import-artwork$suffix" "$GITHUB_WORKSPACE/crates/boardsi-import/tests/fixtures/pads_via_round_through_v94.asc"
          BOARDSI_SOURCE_HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}" ./boardsi-preview-p0$suffix --pad-selftest "$GITHUB_WORKSPACE/target/debug/boardsi-worker$suffix" "$GITHUB_WORKSPACE/build-qt/qt-model-a.frame" "$GITHUB_WORKSPACE/build-qt/qt-model-b.frame" "$GITHUB_WORKSPACE/target/debug/boardsi-import-artwork$suffix" "$GITHUB_WORKSPACE/crates/boardsi-import/tests/fixtures/pads_component_simple_v94.asc"
          BOARDSI_SOURCE_HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}" ./boardsi-preview-p0$suffix --rect-selftest "$GITHUB_WORKSPACE/target/debug/boardsi-worker$suffix" "$GITHUB_WORKSPACE/build-qt/qt-model-a.frame" "$GITHUB_WORKSPACE/build-qt/qt-model-b.frame" "$GITHUB_WORKSPACE/target/debug/boardsi-import-artwork$suffix" "$GITHUB_WORKSPACE/crates/boardsi-import/tests/fixtures/pads_rf_rectangle_v94.asc"
          BOARDSI_SOURCE_HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}" ./boardsi-preview-p0$suffix --bottom-selftest "$GITHUB_WORKSPACE/target/debug/boardsi-worker$suffix" "$GITHUB_WORKSPACE/build-qt/qt-model-a.frame" "$GITHUB_WORKSPACE/build-qt/qt-model-b.frame" "$GITHUB_WORKSPACE/target/debug/boardsi-import-artwork$suffix" "$GITHUB_WORKSPACE/crates/boardsi-import/tests/fixtures/pads_bottom_mirror_v94.asc"
          BOARDSI_SOURCE_HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}" ./boardsi-preview-p0$suffix --arc-selftest "$GITHUB_WORKSPACE/target/debug/boardsi-worker$suffix" "$GITHUB_WORKSPACE/build-qt/qt-model-a.frame" "$GITHUB_WORKSPACE/build-qt/qt-model-b.frame" "$GITHUB_WORKSPACE/target/debug/boardsi-import-artwork$suffix" "$GITHUB_WORKSPACE/crates/boardsi-import/tests/fixtures/pads_route_arc_v94.asc"
          BOARDSI_SOURCE_HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}" ./boardsi-preview-p0$suffix --outline-selftest "$GITHUB_WORKSPACE/target/debug/boardsi-worker$suffix" "$GITHUB_WORKSPACE/build-qt/qt-model-a.frame" "$GITHUB_WORKSPACE/build-qt/qt-model-b.frame" "$GITHUB_WORKSPACE/target/debug/boardsi-import-artwork$suffix" "$GITHUB_WORKSPACE/crates/boardsi-import/tests/fixtures/pads_board_outline_cutout_v94.asc"
          BOARDSI_SOURCE_HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}" ./boardsi-preview-p0$suffix --circle-selftest "$GITHUB_WORKSPACE/target/debug/boardsi-worker$suffix" "$GITHUB_WORKSPACE/build-qt/qt-model-a.frame" "$GITHUB_WORKSPACE/build-qt/qt-model-b.frame" "$GITHUB_WORKSPACE/target/debug/boardsi-import-artwork$suffix" "$GITHUB_WORKSPACE/crates/boardsi-import/tests/fixtures/pads_board_circle_cutout_v94.asc"
          BOARDSI_SOURCE_HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}" ./boardsi-preview-p0$suffix --mixed-outline-selftest "$GITHUB_WORKSPACE/target/debug/boardsi-worker$suffix" "$GITHUB_WORKSPACE/build-qt/qt-model-a.frame" "$GITHUB_WORKSPACE/build-qt/qt-model-b.frame" "$GITHUB_WORKSPACE/target/debug/boardsi-import-artwork$suffix" "$GITHUB_WORKSPACE/crates/boardsi-import/tests/fixtures/pads_board_mixed_cutout_v94.asc"
          BOARDSI_SOURCE_HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}" ./boardsi-preview-p0$suffix --renderer-selftest "$GITHUB_WORKSPACE/target/debug/boardsi-worker$suffix" "$GITHUB_WORKSPACE/build-qt/qt-model-a.frame" "$GITHUB_WORKSPACE/build-qt/qt-model-b.frame"
          cat qt-preview-renderer-results.json
          cat qt-preview-p2e-bottom-results.json
          cat qt-preview-p2f-arc-results.json
          cat qt-preview-p2g-outline-results.json
          cat qt-preview-p2h-circle-results.json
          cat qt-preview-p2d-rect-results.json
          cat qt-preview-p2c-pad-results.json
          cat qt-preview-p2b-via-results.json
          cat qt-preview-p0-results.json
      - name: Exercise Windows x64 developer desktop launcher
        if: matrix.name == 'Windows x64'
        shell: pwsh
        env:
          BOARDSI_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $nativeReceipt = 'build-qt/qt-preview-p0-results.json'
          $directReceipt = 'build-qt/qt-preview-native-direct.json'
          if (-not (Test-Path -PathType Leaf $nativeReceipt)) {
            throw 'Missing direct native GUI smoke receipt'
          }
          Move-Item -LiteralPath $nativeReceipt -Destination $directReceipt -Force
          ./scripts/run-boardsi-preview-windows-x64.ps1 -SelfTest
          if (-not (Test-Path -PathType Leaf $nativeReceipt)) {
            throw 'Missing developer launcher GUI smoke receipt'
          }
          $receipt = Get-Content -LiteralPath $nativeReceipt -Raw | ConvertFrom-Json
          if ($receipt.pass -ne $true -or $receipt.p2a_imported_artwork -ne $true -or
              $receipt.p2a_properties_source_isolation_verified -ne $true -or
              $receipt.p2a_import_summary_counts_verified -ne $true -or
              $receipt.p2a_import_failure_recovery_verified -ne $true -or
              $receipt.source_sha -ne $env:BOARDSI_SOURCE_HEAD_SHA) {
            throw 'Developer launcher receipt does not prove current-HEAD P2-A source-isolation smoke'
          }
      - name: Stage Windows x64 Qt-bundled release test and license sources
        if: matrix.name == 'Windows x64'
        shell: pwsh
        run: |
          ./scripts/stage-boardsi-preview-windows-x64-qt.ps1 -StagePath 'build-qt/boardsi-preview-windows-x64-qt-bundled'
      - name: Verify Qt-bundled artifact without separately installed Qt SDK
        if: matrix.name == 'Windows x64'
        shell: pwsh
        env:
          BOARDSI_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = 'build-qt/boardsi-preview-windows-x64-qt-bundled'
          $copy = Join-Path $env:RUNNER_TEMP 'BoardSI Qt 한글 공백'
          Copy-Item -LiteralPath $stage -Destination $copy -Recurse -Force
          $runner = Join-Path $copy 'run-preview.ps1'
          $oldQt = $env:QT_PREFIX
          $oldPlugin = $env:QT_PLUGIN_PATH
          $oldPath = $env:PATH
          try {
            $env:QT_PREFIX = $null
            $env:QT_PLUGIN_PATH = $null
            $qtBin = (Join-Path $oldQt 'bin').TrimEnd('\','/')
            $env:PATH = (($oldPath -split ';') | Where-Object {$_.TrimEnd('\','/') -ine $qtBin}) -join ';'
            & $runner -ValidateOnly
            $receipt = 'build-qt/qt-preview-p0-results.json'
            if (-not (Test-Path -LiteralPath $receipt -PathType Leaf)) {throw 'Missing source launcher receipt'}
            Move-Item -LiteralPath $receipt -Destination 'build-qt/qt-preview-source-launcher.json' -Force
            & $runner -SelfTest -EvidenceDirectory 'build-qt'
            if (-not (Test-Path -LiteralPath $receipt -PathType Leaf)) {throw 'Missing Qt-bundled GUI smoke receipt'}
            $e = Get-Content -LiteralPath $receipt -Raw | ConvertFrom-Json
            if ($e.pass -ne $true -or $e.p2a_imported_artwork -ne $true -or
                $e.p2a_properties_source_isolation_verified -ne $true -or
                $e.p2a_import_summary_counts_verified -ne $true -or
                $e.p2a_import_failure_recovery_verified -ne $true -or
                $e.source_sha -ne $env:BOARDSI_SOURCE_HEAD_SHA) {
              throw 'Bundled Qt native smoke identity or import assertions failed'
            }
            Copy-Item -LiteralPath $receipt -Destination 'build-qt/qt-preview-staged-package.json'
            Push-Location 'build-qt'
            try {
              $exe=Join-Path $copy 'boardsi-preview-p0.exe'
              $worker=Join-Path $copy 'boardsi-worker.exe'
              $a=Join-Path $copy 'qt-model-a.frame'
              $b=Join-Path $copy 'qt-model-b.frame'
              $importer=Join-Path $copy 'boardsi-import-artwork.exe'
              $fixture=Join-Path $copy 'public-pads-v94-synthetic.asc'
              & $exe --selftest $worker $a $b $importer $fixture
              if ($LASTEXITCODE -ne 0) {throw 'Direct Windows executable bundled Qt smoke failed'}
            } finally {Pop-Location}
            $direct=Get-Content -LiteralPath $receipt -Raw | ConvertFrom-Json
            if ($direct.pass -ne $true -or $direct.source_sha -ne $env:BOARDSI_SOURCE_HEAD_SHA) {
              throw 'Direct Qt EXE smoke did not prove exact source HEAD'
            }
            Copy-Item -LiteralPath $receipt -Destination 'build-qt/qt-preview-standalone-direct.json'
          } finally {
            $env:PATH=$oldPath
            $env:QT_PREFIX=$oldQt
            $env:QT_PLUGIN_PATH=$oldPlugin
          }
          $entries = @(Get-Content -LiteralPath (Join-Path $copy 'SHA256SUMS.txt'))
          if ($entries.Count -lt 17) {throw 'Bundled manifest too short'}
          foreach ($line in $entries) {
            $pair=$line -split '  ',2
            if ($pair.Count -ne 2 -or $pair[0] -notmatch '^[A-Fa-f0-9]{64}$') {throw 'Invalid bundled manifest'}
            $actual=(Get-FileHash -LiteralPath (Join-Path $copy $pair[1]) -Algorithm SHA256).Hash
            if ($actual -ne $pair[0]) {throw ('Bundled checksum mismatch: '+$pair[1])}
          }
      - name: Upload Windows x64 Qt-bundled test archive
        if: matrix.name == 'Windows x64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: boardsi-preview-p2a-windows-x64-qt-bundled-test
          path: build-qt/boardsi-preview-windows-x64-qt-bundled/
          if-no-files-found: error
          retention-days: 7
      # A_014 builds the Qt Quick variant only AFTER the six-Qt-DLL legacy
      # package gate. This keeps existing M0/F7 packaging compliance intact.
      - name: Install additional Qt Quick modules for source-only RHI validation
        shell: bash
        run: |
          python -m aqt install-qt '${{ matrix.host }}' desktop 6.8.3 '${{ matrix.qt_arch }}' --archives qtdeclarative qtshadertools -O "$RUNNER_TEMP/qt-native"
          if test -n "$QT_HOST_PREFIX"; then
            python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 --archives qtdeclarative qtshadertools -O "$RUNNER_TEMP/qt-native"
          fi
      - name: Rebuild source-only Qt Quick variant on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & cmd /c (Join-Path $env:RUNNER_TEMP 'boardsi-build-qt.cmd')
          if ($LASTEXITCODE -ne 0) {throw 'Qt Quick rebuild failed'}
          if (-not (Select-String -LiteralPath 'build-qt/CMakeCache.txt' -Pattern 'Qt6Quick_DIR:' -Quiet)) {
            throw 'Qt Quick was not found by the native source build'
          }
      - name: Rebuild source-only Qt Quick variant on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cmake -S apps/boardsi-qt-prototype -B build-qt -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_PREFIX_PATH="$QT_PREFIX" -DBOARDSI_WORKER="$GITHUB_WORKSPACE/target/debug/boardsi-worker"
          cmake --build build-qt --parallel 2
          grep -q '^Qt6Quick_DIR:' build-qt/CMakeCache.txt
      - name: Validate A_014 Qt Quick in real P2-E imported Artwork Viewer
        shell: bash
        run: |
          cd build-qt
          suffix=''
          if test '${{ runner.os }}' = Windows; then suffix='.exe'; fi
          BOARDSI_SOURCE_HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}" ./boardsi-preview-p0$suffix --bottom-selftest "$GITHUB_WORKSPACE/target/debug/boardsi-worker$suffix" "$GITHUB_WORKSPACE/build-qt/qt-model-a.frame" "$GITHUB_WORKSPACE/build-qt/qt-model-b.frame" "$GITHUB_WORKSPACE/target/debug/boardsi-import-artwork$suffix" "$GITHUB_WORKSPACE/crates/boardsi-import/tests/fixtures/pads_bottom_mirror_v94.asc"
          cat qt-preview-p2e-bottom-results.json
          python -c 'import json,platform; r=json.load(open("qt-preview-p2e-bottom-results.json")); assert r["pass"] and ((r["rhi_view_checked"] and r["rhi_first_frame_confirmed"]) or (platform.system()=="Windows" and r["rhi_cpu_fallback"])), r'
      - name: Validate A_015 native P2-F Arc import and RHI artwork path
        shell: bash
        run: |
          cd build-qt
          suffix=''
          if test '${{ runner.os }}' = Windows; then suffix='.exe'; fi
          BOARDSI_SOURCE_HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}" ./boardsi-preview-p0$suffix --arc-selftest "$GITHUB_WORKSPACE/target/debug/boardsi-worker$suffix" "$GITHUB_WORKSPACE/build-qt/qt-model-a.frame" "$GITHUB_WORKSPACE/build-qt/qt-model-b.frame" "$GITHUB_WORKSPACE/target/debug/boardsi-import-artwork$suffix" "$GITHUB_WORKSPACE/crates/boardsi-import/tests/fixtures/pads_route_arc_v94.asc"
          cat qt-preview-p2f-arc-results.json
          python -c 'import json; r=json.load(open("qt-preview-p2f-arc-results.json")); assert r["pass"] and r["schema"]=="boardsi-preview-p2f-arc-smoke-v1", r'
      - name: Validate A_017 native P2-H circular board/cutout RHI artwork
        shell: bash
        run: |
          cd build-qt
          suffix=''
          if test '${{ runner.os }}' = Windows; then suffix='.exe'; fi
