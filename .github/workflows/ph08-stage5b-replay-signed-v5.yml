name: One-shot signed Stage 5B metadata fail-closed fix
on:
  push:
    branches: [ops/ph08-stage5b-replay-sign-20261017]
    paths: [".github/workflows/ph08-stage5b-replay-signed-v5.yml"]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 6af4294fbe6e520b06ce0aebaa198b1179f3481f
          persist-credentials: false
      - name: Publish exact GitHub-Verified source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,pathlib,subprocess,base64
          source="6af4294fbe6e520b06ce0aebaa198b1179f3481f"
          previous="17a1347268b1cc701b6f34264064cbe3f807c852"
          files=["tools/validation/ph08_stage5b_original_replay.py",
                 "tools/validation/test_ph08_stage5b_original_replay.py"]
          if subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()!=source:
              raise SystemExit("source SHA mismatch")
          changes=[]
          for name in files:
              p=pathlib.Path(name)
              if not p.is_file() or p.is_symlink():raise SystemExit("unsafe source")
              changes.append({"path":name,"contents":base64.b64encode(p.read_bytes()).decode()})
          q="mutation($input:CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid}}}"
          body={"query":q,"variables":{"input":{
             "branch":{"repositoryNameWithOwner":"july-rust/BoardSI",
                       "branchName":"publish/ph08-stage5b-replay-verified-20261017"},
             "expectedHeadOid":previous,
             "message":{"headline":"fix(ph08): sanitize corrupt numerical package metadata"},
             "fileChanges":{"additions":changes}}}}
          req=urllib.request.Request("https://api.github.com/graphql",
              data=json.dumps(body).encode(),method="POST",
              headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                       "Accept":"application/vnd.github+json",
                       "Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=35) as response: ans=json.load(response)
          if ans.get("errors") or not ans.get("data",{}).get("createCommitOnBranch"):
              raise SystemExit("verified publication rejected")
          print("SIGNED_SHA="+ans["data"]["createCommitOnBranch"]["commit"]["oid"])
          PY
