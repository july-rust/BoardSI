name: TEMP PH-08 Gate Q signed evidence revision
on:
  push:
    branches: [ops/ph08-gateq-bootstrap-51]
    paths: [.github/workflows/ph08-gateq-signed-publish-temp-v2.yml]
permissions:
  contents: write
jobs:
  signed-revision:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.repository == 'july-rust/BoardSI'
    steps:
      - uses: actions/checkout@v5
      - name: Publish evidence and provenance revision with GitHub Verified GraphQL
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, urllib.request
          repo=os.environ["REPO"]; token=os.environ["GH_TOKEN"]
          previous="5a4144ace651af56146cd8624fec22dc3afa4449"
          branch="feature/ph08-gateq-independent-51"
          paths=["docs/validation/m2-g2-ph08-gateq-independent-ci-evidence.md",
                 ".github/workflows/m2-ph08-gateq-independent.yml"]
          def api(url,obj=None):
              data=None if obj is None else json.dumps(obj).encode()
              req=urllib.request.Request(url,data=data,headers={
                  "Authorization":"Bearer "+token,"Accept":"application/vnd.github+json",
                  "Content-Type":"application/json","X-GitHub-Api-Version":"2022-11-28"})
              with urllib.request.urlopen(req,timeout=40) as resp:
                  return json.loads(resp.read())
          r=api("https://api.github.com/repos/"+repo+"/git/ref/heads/"+branch)
          if r["object"]["sha"]!=previous: raise RuntimeError("signed head changed; abort")
          a=[{"path":p,"contents":base64.b64encode(pathlib.Path(p).read_bytes()).decode()} for p in paths]
          mutation="""mutation($input: CreateCommitOnBranchInput!) {
            createCommitOnBranch(input:$input) { commit { oid url } }
          }"""
          out=api("https://api.github.com/graphql",{"query":mutation,"variables":{"input":{
            "branch":{"repositoryNameWithOwner":repo,"branchName":branch},
            "message":{"headline":"docs(m2): preserve Gate Q CI numeric evidence and PR head provenance"},
            "fileChanges":{"additions":a},"expectedHeadOid":previous}}})
          if out.get("errors"): raise RuntimeError(str(out["errors"]))
          commit=out["data"]["createCommitOnBranch"]["commit"]
          check=api("https://api.github.com/repos/"+repo+"/commits/"+commit["oid"])
          proof=check["commit"]["verification"]
          print(json.dumps({"commit":commit["oid"],"verified":proof["verified"],
                            "reason":proof["reason"],"url":commit["url"]}))
          if not proof["verified"]: raise RuntimeError("unsigned commit unexpectedly created")
          PY
