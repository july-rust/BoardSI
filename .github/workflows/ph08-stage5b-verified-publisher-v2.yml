name: One-shot PH-08 Stage 5B signed fix publisher
on:
  push:
    branches: [ops/ph08-stage5b-signing-20261017]
    paths: [".github/workflows/ph08-stage5b-verified-publisher-v2.yml"]
permissions:
  contents: write
jobs:
  signed-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 28c7a034a314a4e3a0674aab532a7f38b861297c
          persist-credentials: false
      - name: Publish exact reviewed Stage 5B corrections as GitHub Verified
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import base64,json,os,pathlib,subprocess,urllib.request
          SRC="28c7a034a314a4e3a0674aab532a7f38b861297c"
          PARENT="2b29b205f4842e133d00a79146698d018f52d691"
          paths=[
             "tools/validation/ph08_stage5b_preflight.py",
             "tools/validation/test_ph08_stage5b_preflight.py",
             "docs/validation/m2-g2-ph08-stage5b-original-replay-evidence.md",
             "docs/validation/README.md",
          ]
          if subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()!=SRC:
              raise SystemExit("invalid staging source")
          additions=[]
          for name in paths:
              p=pathlib.Path(name)
              if not p.is_file() or p.is_symlink():
                  raise SystemExit("invalid source file")
              additions.append({"path":name,"contents":base64.b64encode(p.read_bytes()).decode()})
          query="mutation($input:CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid url}}}"
          inputs={"branch":{"repositoryNameWithOwner":"july-rust/BoardSI",
                            "branchName":"publish/ph08-stage5b-verified-20261017"},
                  "message":{"headline":"fix(ph08): close Stage 5B audit TOCTOU and coverage gaps"},
                  "fileChanges":{"additions":additions},"expectedHeadOid":PARENT}
          b=json.dumps({"query":query,"variables":{"input":inputs}}).encode()
          request=urllib.request.Request(
              "https://api.github.com/graphql",data=b,method="POST",
              headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                       "Content-Type":"application/json",
                       "Accept":"application/vnd.github+json"})
          with urllib.request.urlopen(request,timeout=35) as response:
              ans=json.load(response)
          if ans.get("errors") or not ans.get("data",{}).get("createCommitOnBranch"):
              raise SystemExit("signed publication rejected")
          print("FINAL_SIGNED_SHA="+ans["data"]["createCommitOnBranch"]["commit"]["oid"])
          PY
