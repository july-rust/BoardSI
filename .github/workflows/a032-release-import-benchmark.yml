name: A032 release import benchmark

on:
  pull_request:
    paths:
      - 'crates/boardsi-import/src/**'
      - 'crates/boardsi-model/src/**'
      - '.github/workflows/a032-release-import-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a032-release-10k:
    name: A032 release 10k source-route import
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.75.0 --profile minimal
          rustup default 1.75.0
      - name: Build optimized source importer
        shell: bash
        run: cargo build --release --locked -p boardsi-import --bin boardsi-import-artwork
      - name: Benchmark exact 10,000-segment valid source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import resource
          import statistics
          import subprocess
          import tempfile
          import time

          with tempfile.TemporaryDirectory() as tmp:
              fixture = Path(tmp) / "a032_public_synthetic_10k.asc"
              with fixture.open("w", encoding="ascii", newline="\n") as f:
                  f.write("!PADS-POWERPCB-V9.4-MILS! DESIGN DATABASE ASCII FILE 1.0\n*PCB*\nMAXLAYER 4\n*ROUTE*\n*SIGNAL* NET_A\nU1.1 U2.2\n")
                  for i in range(100, 10101):
                      f.write(f"{i} 200 1 10 0\n")
                  f.write("*END*\n")
              timings=[]
              legacy=None
              for j in range(4):
                  args = ["target/release/boardsi-import-artwork", str(fixture), "--contact-records-v1"]
                  start=time.perf_counter()
                  result=subprocess.run(args, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=20)
                  elapsed=time.perf_counter()-start
                  if result.returncode:
                      raise SystemExit(f"release import failed exit={result.returncode}; stderr={result.stderr.decode('ascii',errors='replace')[:256]}")
                  if b"BOARDSI_CONTACT_RECORDS_V1|" not in result.stdout or b"BOARDSI_CONTACT_END_V1|" not in result.stdout:
                      raise SystemExit("missing opt-in source contact transport")
                  if j: timings.append(elapsed)
                  if j == 0: legacy = len(result.stdout)
              worst=max(timings)
              report={"schema":"a032-release-import-10k-v1",
                      "public_synthetic_segments":10000,
                      "source":"PADS V9.4 MILS synthetic straight chain",
                      "rust_profile":"release",
                      "elapsed_s":timings,
                      "worst_s":worst,
                      "median_s":statistics.median(timings),
                      "combined_output_bytes":legacy,
                      "peak_child_rss_kib":resource.getrusage(resource.RUSAGE_CHILDREN).ru_maxrss,
                      "qt_gui_deadline_s":10.0,
                      "qt_10s_end_to_end":"NOT_RUN",
                      "full_board_electrical_connectivity":"NOT_VERIFIED"}
              print(json.dumps(report,sort_keys=True))
              if worst >= 8.0:
                  raise SystemExit("FAIL: release import lacks 2 s Qt deadline headroom")
          PY
