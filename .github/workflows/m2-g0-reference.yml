name: M2 synthetic G0 reference
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m2-g0-${{ github.ref }}
  cancel-in-progress: true
jobs:
  classify:
    name: Classify documentation-only changes
    runs-on: ubuntu-latest
    timeout-minutes: 4
    outputs:
      docs_only: ${{ steps.docs_only.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/classify-docs-only
        id: docs_only
  independent-fvm:
    needs: classify
    # The classifier failing must NEVER suppress a required platform build.
    # For a verified docs-only PR, skip the entire job before runner allocation.
    if: ${{ !cancelled() && (needs.classify.result != 'success' || needs.classify.outputs.docs_only != 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install fixed public scientific reference dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Run the independent field oracle and holdout checker
        run: |
          python -V
          python -m py_compile tools/validation/m2_fvm_reference.py tools/validation/m2_g0_verify.py
          sha256sum -c tools/validation/m2_g0_source.sha256
          /usr/bin/time -v python tools/validation/m2_fvm_reference.py --suite holdout --output g0-reproduction.json
          python tools/validation/m2_g0_verify.py tools/validation/m2_g0_holdout.csv g0-reproduction.json
