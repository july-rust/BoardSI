name: PH-08 one-shot Signed P2 follow-up
on:
  push:
    branches: [ops/ph08-hmm-gateq-signer]
    paths: [.github/workflows/ph08-oneshot-signer.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/ph08-hmm-recovery-validation-hardening
          persist-credentials: false
      - name: Signed P2 corrections
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,subprocess,json,base64,urllib.request,urllib.error
          from pathlib import Path
          repo=os.environ["GITHUB_REPOSITORY"]
          token=os.environ["GITHUB_TOKEN"]
          src="feature/ph08-hmm-recovery-validation-hardening"
          dest="feature/ph08-hmm-recovery-validation-hardening-signed"
          source_sha="3a299f29322924e10c66d610a9b3d6a424c5b639"
          head_sha="57a614cdf925ed5523bbc6ebaeeb73494a3a406d"
          paths=["tools/validation/ph08_gateq_hmm_bridge.py",
                 "tools/validation/test_ph08_gateq_recovery_hardening.py"]
          wf=".github/workflows/m2-ph08-gateq-independent.yml"
          def call(path,payload=None):
              req=urllib.request.Request("https://api.github.com"+path,
                 data=None if payload is None else json.dumps(payload).encode(),
                 headers={"Authorization":"Bearer "+token,
                          "X-GitHub-Api-Version":"2022-11-28",
                          "Accept":"application/vnd.github+json",
                          "Content-Type":"application/json"},
                 method="GET" if payload is None else "POST")
              try:
                  with urllib.request.urlopen(req,timeout=40) as r:return json.load(r)
              except urllib.error.HTTPError as e:
                  raise RuntimeError(f"GitHub HTTP {e.code} at {path}") from None
          checkout=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          actual_src=call(f"/repos/{repo}/git/ref/heads/{src}")["object"]["sha"]
          actual_dst=call(f"/repos/{repo}/git/ref/heads/{dest}")["object"]["sha"]
          if (checkout!=source_sha or actual_src!=source_sha or actual_dst!=head_sha):
              raise RuntimeError("source or signed branch changed; abort")
          def commit(filelist,expected):
              adds=[{"path":p,"contents":base64.b64encode(Path(p).read_bytes()).decode("ascii")}
                    for p in filelist]
              query="mutation($input:CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid url}}}"
              values={"input":{"branch":{"repositoryNameWithOwner":repo,"branchName":dest},
                               "message":{"headline":"fix(ph08): address Codex P2 capture and CI review"},
                               "fileChanges":{"additions":adds},"expectedHeadOid":expected}}
              return call("/graphql",{"query":query,"variables":values})
          response=commit(paths+[wf],head_sha)
          if response.get("errors"):
              print("WORKFLOW_SIGNATURE_PERMISSION=DENIED")
              print("GraphQL error types="+",".join(str(x.get("type","")) for x in response["errors"]))
              response=commit(paths,head_sha)
          else:
              print("WORKFLOW_SIGNATURE_PERMISSION=ALLOWED")
          if response.get("errors"):
              raise RuntimeError("GraphQL signing failed")
          print("SIGNED_HEAD="+response["data"]["createCommitOnBranch"]["commit"]["oid"])
          print("SOURCE_HEAD="+checkout)
          PY
