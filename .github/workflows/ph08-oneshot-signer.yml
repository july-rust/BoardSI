name: PH-08 one-shot GitHub Verified source publisher
on:
  push:
    branches:
      - ops/ph08-hmm-gateq-signer
    paths:
      - .github/workflows/ph08-oneshot-signer.yml
permissions:
  contents: write
jobs:
  publish:
    name: Sign PH-08 tools with GraphQL
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.repository == 'july-rust/BoardSI'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/ph08-hmm-recovery-validation-hardening
          persist-credentials: false
      - name: Verify immutable source and publish signed commit from main
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE: 2c70cdf60cefa8f9704d6ac0294231a97cfcd7d4
          EXPECTED_MAIN: 86d7d869a51ed2d8e1c47f0f131455f9d2dedb7c
          SOURCE_BRANCH: feature/ph08-hmm-recovery-validation-hardening
          SIGNED_BRANCH: feature/ph08-hmm-recovery-validation-hardening-signed
        run: |
          python3 - <<'PY'
          import base64, json, os, subprocess, urllib.request, urllib.error
          from pathlib import Path
          repo=os.environ["GITHUB_REPOSITORY"]
          token=os.environ["GITHUB_TOKEN"]
          paths=[
            "tools/validation/ph08_gateq_hmm_bridge.py",
            "tools/validation/ph08_gateq_recovery_hardening.py",
            "tools/validation/test_ph08_gateq_recovery_hardening.py",
            "tools/validation/test_ph08_gateq_independent.py",
            "docs/validation/m2-g2-ph08-recovery-hardening-evidence.md",
          ]
          def call(path, payload=None, method=None):
              url="https://api.github.com"+path
              data=None if payload is None else json.dumps(payload).encode("utf-8")
              req=urllib.request.Request(url,data=data,method=method or ("POST" if payload is not None else "GET"),
                  headers={"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json",
                           "X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=30) as res:
                      return json.load(res)
              except urllib.error.HTTPError as e:
                  raise RuntimeError(f"GitHub API {path} HTTP {e.code} (body redacted)") from None
          checkout=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          if checkout!=os.environ["EXPECTED_SOURCE"]:
              raise RuntimeError("source HEAD drift; refusing to publish")
          src=call(f"/repos/{repo}/git/ref/heads/{os.environ['SOURCE_BRANCH']}")
          main=call(f"/repos/{repo}/git/ref/heads/main")
          if src["object"]["sha"]!=checkout or main["object"]["sha"]!=os.environ["EXPECTED_MAIN"]:
              raise RuntimeError("upstream source/main SHA drift; refusing to publish")
          dst=os.environ["SIGNED_BRANCH"]
          try:
              pre=call(f"/repos/{repo}/git/ref/heads/{dst}")
              if pre["object"]["sha"]!=main["object"]["sha"]:
                  raise RuntimeError("signed branch exists with non-baseline HEAD; refusing overwrite")
          except RuntimeError as e:
              if "HTTP 404" not in str(e):
                  raise
              call(f"/repos/{repo}/git/refs",{"ref":"refs/heads/"+dst,
                                          "sha":main["object"]["sha"]})
          filechanges=[{"path":p,"contents":base64.b64encode(Path(p).read_bytes()).decode("ascii")}
                       for p in paths]
          gql={"query":"""mutation($input:CreateCommitOnBranchInput!){
             createCommitOnBranch(input:$input) { commit { oid url } }
             }""",
             "variables":{"input":{"branch":{"repositoryNameWithOwner":repo,"branchName":dst},
                 "message":{"headline":"test(ph08): harden original Recovery and fail-closed Gate Q diagnostics"},
                 "fileChanges":{"additions":filechanges},
                 "expectedHeadOid":main["object"]["sha"]}}}
          out=call("/graphql",gql)
          if out.get("errors"):
              raise RuntimeError("GraphQL createCommitOnBranch rejected: "+
                  json.dumps([{"type":x.get("type"),"message":x.get("message")} for x in out["errors"]]))
          oid=out["data"]["createCommitOnBranch"]["commit"]["oid"]
          print("SIGNED_HEAD="+oid)
          print("SOURCE_HEAD="+checkout)
          print("SIGNED_BRANCH="+dst)
          PY
