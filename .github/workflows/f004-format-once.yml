name: F004 Temporary Rustfmt Closure
on:
  push:
    branches: [feat/f004-compatibility-golden]
permissions:
  contents: write
jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Format all Rust files using project toolchain
        shell: bash
        run: |
          rustup toolchain install 1.75.0 --profile minimal --component rustfmt
          cargo +1.75.0 fmt --all
          git add -u
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(F_004): apply rustfmt 1.75 to migration and tests"
            git push origin HEAD:refs/heads/feat/f004-compatibility-golden
          fi
