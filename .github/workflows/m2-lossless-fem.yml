name: M2 isolated lossless FEM prototype
on:
  pull_request:
    paths:
      - 'prototypes/m2-lossless-fem/**'
      - 'tools/validation/m2_s2_analytic_check.py'
      - 'tools/validation/m2_g1_field_check.py'
      - 'tools/validation/m2_ph03_plate_check.py'
      - 'tools/validation/m2_ph05_stripline_reference.py'
      - 'docs/validation/m2-g2-ph05-acceptance-contract.md'
      - 'docs/validation/m2-ph03-parallel-plate-acceptance-contract.md'
      - 'tools/validation/m2_fvm_reference.py'
      - 'tools/validation/m2_g0_source.sha256'
      - '.github/workflows/m2-lossless-fem.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m2-fem-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust-fem:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install matching isolated Rust test toolchain
        run: rustup toolchain install 1.75.0 --profile minimal --component clippy
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install fixed independent reference dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Compile and execute isolated physical prototype tests
        run: |
          cargo +1.75.0 test --manifest-path prototypes/m2-lossless-fem/Cargo.toml --release -- --nocapture
          cargo +1.75.0 clippy --manifest-path prototypes/m2-lossless-fem/Cargo.toml --all-targets -- -D warnings
      - name: Measure independent PEC coupon FEM executable
        run: |
          cargo +1.75.0 build --manifest-path prototypes/m2-lossless-fem/Cargo.toml --release
          set -o pipefail
          /usr/bin/time -v prototypes/m2-lossless-fem/target/release/boardsi-m2-lossless-fem 32 0.0012 | tee m2-fem-n32.json
          python -m py_compile tools/validation/m2_g1_field_check.py tools/validation/m2_s2_analytic_check.py
          python tools/validation/m2_s2_analytic_check.py --self-test
          python tools/validation/m2_s2_analytic_check.py m2-fem-n32.json
          # PH-20: a huge but finite box must return a diagnosed error, not
          # succeed or panic in optimized/release arithmetic.
          if prototypes/m2-lossless-fem/target/release/boardsi-m2-lossless-fem 32 1e300 > m2-invalid-stdout.txt 2> m2-invalid-stderr.txt; then
            echo "FAIL: enormous mesh was accepted"
            exit 1
          fi
          grep -q "unsupported or numerical failure:" m2-invalid-stderr.txt
          if grep -qi "panicked" m2-invalid-stderr.txt; then
            echo "FAIL: enormous mesh caused Rust panic"
            exit 1
          fi
          test ! -s m2-invalid-stdout.txt
          python tools/validation/m2_g1_field_check.py m2-fem-n32.json
      - name: Execute exact PH-03 insulated-sidewall FEM and frozen independent math gate
        run: |
          set -euo pipefail
          python -m py_compile tools/validation/m2_ph03_plate_check.py
          python tools/validation/m2_ph03_plate_check.py --self-test
          for n in 8 16 32; do
            /usr/bin/time -v -o "ph03-n${n}-resources.txt" \
              prototypes/m2-lossless-fem/target/release/boardsi-m2-lossless-fem plate "$n" | tee "ph03-n${n}.json"
            echo "PH-03 n=$n resource measurement:"
            cat "ph03-n${n}-resources.txt"
          done
          python tools/validation/m2_ph03_plate_check.py ph03-n8.json ph03-n16.json ph03-n32.json
          # CLI negative control must not report successful computation or panic.
          if prototypes/m2-lossless-fem/target/release/boardsi-m2-lossless-fem plate 0 > ph03-invalid-out.txt 2> ph03-invalid-err.txt; then
            echo "FAIL: invalid PH-03 mesh accepted"
            exit 1
          fi
          grep -q "unsupported or numerical failure:" ph03-invalid-err.txt
          if grep -qi "panicked" ph03-invalid-err.txt; then
            echo "FAIL: PH-03 invalid CLI input panicked"
            exit 1
          fi
          test ! -s ph03-invalid-out.txt
      - name: PH-05 independent symmetric stripline FEM and FVM acceptance gate
        run: |
          set -euo pipefail
          bin="prototypes/m2-lossless-fem/target/release/boardsi-m2-lossless-fem"
          python -m py_compile tools/validation/m2_ph05_stripline_reference.py
          python tools/validation/m2_ph05_stripline_reference.py --self-test
          for n in 32 64 128; do
            /usr/bin/time -v -o "ph05-n$n-B12.resources.txt" \
              "$bin" stripline "$n" 0.0012 > "ph05-n$n-B12.json"
          done
          for code in 16 24; do
            if test "$code" = 16; then metres=0.0016; else metres=0.0024; fi
            /usr/bin/time -v -o "ph05-n64-B$code.resources.txt" \
              "$bin" stripline 64 "$metres" > "ph05-n64-B$code.json"
          done
          python tools/validation/m2_ph05_stripline_reference.py \
            --fem ph05-n32-B12.json ph05-n64-B12.json ph05-n128-B12.json \
                  ph05-n64-B16.json ph05-n64-B24.json \
            --output ph05-independent-fvm-evidence.json
          if "$bin" stripline 32 1e300 > ph05-invalid-out.txt 2> ph05-invalid-err.txt; then
            echo "FAIL: PH-05 pathological mesh accepted"
            exit 1
          fi
          grep -q 'unsupported or numerical failure:' ph05-invalid-err.txt
          if grep -qi 'panicked' ph05-invalid-err.txt; then
            echo "FAIL: PH-05 panic on pathological mesh"
            exit 1
          fi
          test ! -s ph05-invalid-out.txt
      - name: Upload PH-05 numerical evidence and resource metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ph05-numerical-evidence
          path: |
            ph05-*.json
            ph05-*.resources.txt
            ph05-invalid-*.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Recheck existing M0 Rust workspace without Qt GUI rebuild
        run: |
          cargo +1.75.0 fetch --locked
          cargo +1.75.0 test --workspace --locked --offline
