name: Validate planning documents
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Reject known private PH-08 archives in every tracked checkout
        shell: bash
        run: |
          python3 tools/validation/ph08_private_archive_guard.py
          python3 -m unittest discover -s tools/validation -p 'test_ph08_private_archive_guard.py' -v
      - name: Check specification IDs and roadmap schema
        run: |
          python3 - <<'PY'
          import json, pathlib
          spec = pathlib.Path('docs/specification/BoardSI_Development_Spec_v1.0.md').read_text(encoding='utf-8')
          plan = json.loads(pathlib.Path('docs/project-plan.json').read_text(encoding='utf-8'))
          assert all('U%02d' % i in spec for i in range(1, 49))
          assert all('T%02d' % i in spec for i in range(1, 55))
          assert len(plan['milestones']) == 11
          assert len(plan['labels']) == 22
          assert len({x['title'] for x in plan['issues']}) == len(plan['issues'])
          assert {x['code'] for x in plan['milestones']} == {x['phase'] for x in plan['issues']}
          assert all(x['priority'] in ('priority:P0','priority:P1','priority:P2') for x in plan['issues'])
          assert all(x['type'] in {z['name'] for z in plan['labels']} for x in plan['issues'])
          assert all('area:' + x['area'] in {z['name'] for z in plan['labels']} for x in plan['issues'])
          assert all(x.get('summary') and len(x['summary']) > 20 for x in plan['issues'])
          print('Planning files validated (not Rust build or SI accuracy)')
          PY
      - name: Require dated checklist checks
        shell: bash
        run: |
          python3 - <<'PY'
          from datetime import date
          from pathlib import Path
          import re

          source = Path('docs/development-checklist.md').read_text(encoding='utf-8')
          checked = [
              (line_number, line)
              for line_number, line in enumerate(source.splitlines(), 1)
              if re.match(r'^\s*- \[[xX]\] ', line)
          ]
          assert checked, 'No checked items found in the development checklist'
          for line_number, line in checked:
              match = re.search(r'\*\*체크일: (\d{4}-\d{2}-\d{2}) KST\*\*', line)
              assert match, f'Missing first-check KST date at line {line_number}'
              date.fromisoformat(match.group(1))
              assert re.search(r'\*\*근거일: \d{4}-\d{2}-\d{2} KST\*\*', line), (
                  f'Missing dated evidence at line {line_number}'
              )
          print(f'Dated development checklist checks verified: {len(checked)}')
          PY
      - name: Verify M0 U/T crosswalk and per-ID ledger, including T44 regression
        run: python3 tools/validation/m0_traceability_check.py
      - name: Validate per-case M0 prototype evidence without promoting full acceptance
        run: |
          python3 tools/validation/m0_case_evidence_check.py
          python3 -m unittest discover -s tools/validation -p 'test_m0_case_evidence_check.py' -v
      - name: Verify frozen acceptance contracts and current audit status
        run: python3 tools/validation/m2_audit_docs_check.py
