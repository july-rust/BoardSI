name: One-time publish PH-08 original operator audit (signed)
on:
  push:
    branches: ["ops/ph08-recovery-signer-once"]
    paths:
      - ".github/workflows/ph08-operator-publisher-once.yml"
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Publish approved public-only staged files via GitHub-signed GraphQL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,json,os,urllib.request
          repo="july-rust/BoardSI"
          source="1c81f18219e5b55535d6c5239006984210cc3301"
          expected="ee869e49cd1514a3a76b33d1c020af9ba0d94768"
          branch="feature/ph08-original-recovery-operator-audit-signed"
          paths=[
            "docs/validation/m2-g2-ph08-original-recovery-operator-evidence.md",
            "tools/validation/ph08_gateq_operator_semantics.py",
            "tools/validation/test_ph08_gateq_operator_semantics.py",
            "tools/validation/test_ph08_gateq_independent.py",
          ]
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                   "Accept":"application/vnd.github+json",
                   "X-GitHub-Api-Version":"2022-11-28",
                   "User-Agent":"boardsi-ph08-one-shot"}
          def api(url,data=None):
            req=urllib.request.Request(url,data=data,headers=headers)
            with urllib.request.urlopen(req,timeout=40) as resp:
              return json.loads(resp.read())
          additions=[]
          for path in paths:
            obj=api("https://api.github.com/repos/"+repo+"/contents/"+path+"?ref="+source)
            if obj.get("type")!="file":
              raise RuntimeError("staged source file missing")
            raw=base64.b64decode(obj["content"])
            additions.append({"path":path,"contents":base64.b64encode(raw).decode("ascii")})
          mutation="""mutation($input:CreateCommitOnBranchInput!){
            createCommitOnBranch(input:$input){commit{oid url}}
          }"""
          inp={"branch":{"repositoryNameWithOwner":repo,"branchName":branch},
               "message":{"headline":"test(ph08): original Recovery operator provenance and fail-closed tests"},
               "fileChanges":{"additions":additions},"expectedHeadOid":expected}
          resp=api("https://api.github.com/graphql",
                   json.dumps({"query":mutation,"variables":{"input":inp}}).encode())
          if "errors" in resp: raise RuntimeError("GitHub publisher rejected: "+repr(resp["errors"]))
          commit=resp["data"]["createCommitOnBranch"]["commit"]
          print("github_signed_commit="+commit["oid"])
          print("commit_url="+commit["url"])
          PY
