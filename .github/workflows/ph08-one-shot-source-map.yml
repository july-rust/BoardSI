name: PH08 Stage4 source map signed change (one-shot)
on:
  push:
    branches: [ops/ph08-source-map-signer-20261016]
permissions:
  contents: write
jobs:
  source-map-verified:
    if: github.repository == 'july-rust/BoardSI' && github.ref == 'refs/heads/ops/ph08-source-map-signer-20261016'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Run synthetic source-map tests and create verified commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import subprocess
          import sys
          import tempfile
          import urllib.parse
          import urllib.request
          
          repo = "july-rust/BoardSI"
          base_sha = "f2e89f9f5b6008e386dfeb719cb9c5e0f7f9d6a7"
          dst = "test/m2-ph08-stage4-manifest-source-map-20261016"
          original = {
              "tools/validation/ph08_evidence_audit.py": "59abdc2e338458b010eb2841d4db19416b651b96",
              "tools/validation/test_ph08_evidence_audit.py": "2f86bdb60aca60c569441920062d536a5a9c5934",
          }
          url_root = "https://api.github.com/repos/" + repo
          token = os.environ["GH_TOKEN"]
          def fetch(url, data=None):
              encoded = json.dumps(data,separators=(",",":")).encode() if data is not None else None
              req = urllib.request.Request(url,data=encoded,method="POST" if encoded else "GET",headers={
                "Authorization":"Bearer "+token,"Accept":"application/vnd.github+json",
                "Content-Type":"application/json","X-GitHub-Api-Version":"2022-11-28"})
              with urllib.request.urlopen(req,timeout=45) as response:
                  return json.load(response)
          
          assert fetch(url_root+"/git/ref/heads/"+dst)["object"]["sha"] == base_sha
          files={}
          for path,sha in original.items():
              item=fetch(url_root+"/contents/"+urllib.parse.quote(path,safe="/")+"?ref="+base_sha)
              assert item["type"]=="file" and item["sha"]==sha,(path,item["sha"])
              files[path]=base64.b64decode(item["content"]).decode("utf-8")
          
          source="tools/validation/ph08_evidence_audit.py"
          needle='''    if not isinstance(obj, list):
                  return None, f"manifest {keys[0]} is not a list"
              records = []
          '''
          replacement='''    if isinstance(obj, dict):
                  # Stage 4 evidence: {"sources": {"basename.py": "<sha256>", ...}}
                  # Resolve ONLY to the immutable evidence/source_snapshot directory,
                  # never to similarly named exploratory/regression files in the ZIP.
                  if not obj:
                      return None, "empty source_snapshot mapping"
                  records = []
                  for basename, digest in obj.items():
                      if (not isinstance(basename, str) or clean_path(basename) is None or
                              "/" in basename):
                          return None, "source_snapshot mapping key must be a safe basename"
                      if not isinstance(digest, str) or not HEX64.fullmatch(digest):
                          return None, "source_snapshot mapping digest must be SHA-256"
                      records.append(("evidence/source_snapshot/" + basename, digest.lower()))
                  return records, "recognized Stage 4 source_snapshot mapping"
              if not isinstance(obj, list):
                  return None, f"manifest {keys[0]} must be a list or recognized source map"
              records = []
          '''
          assert files[source].count(needle)==1
          files[source]=files[source].replace(needle,replacement)
          
          test="tools/validation/test_ph08_evidence_audit.py"
          assert files[test].rstrip().endswith('unittest.main(verbosity=2)')
          insert='''
          
          class Stage4SourceSnapshotMap(unittest.TestCase):
              def setUp(self):
                  self.temp = tempfile.TemporaryDirectory()
                  self.addCleanup(self.temp.cleanup)
                  self.path = Path(self.temp.name) / "stage4-map.zip"
          
              def make(self, mapping=None, source=b"original synthetic", raw_manifest=None):
                  digest_source = digest(source)
                  if mapping is None:
                      mapping = {"ref.py": digest_source}
                  manifest = raw_manifest or json.dumps({"sources": mapping}).encode()
                  files = {"evidence/source_snapshot/ref.py": source, "evidence/manifest.json": manifest}
                  sums = "".join(f"{digest(v)}  {name}\\n" for name,v in files.items()).encode()
                  with zipfile.ZipFile(self.path, "w") as z:
                      for name, value in files.items():
                          z.writestr(name, value)
                      z.writestr("SHA256SUMS", sums)
                  return inspect(self.path, expected_sha256=digest(self.path.read_bytes()),
                                 expected_entries=2, expected_sources=1)
          
              def test_valid_source_map(self):
                  r = self.make()
                  self.assertEqual(r["result"], "PASS")
                  self.assertEqual((r["checksum_verified"], r["source_hash_verified"]), (2, 1))
          
              def test_source_map_digest_tamper(self):
                  r = self.make({"ref.py": "0" * 64})
                  self.assertEqual(r["result"], "FAIL")
                  self.assertTrue(any("source inventory sha256 mismatch" in x for x in r["failures"]))
          
              def test_source_map_unsafe_key(self):
                  r = self.make({"../ref.py": "0" * 64})
                  self.assertEqual(r["result"], "NOT_VERIFIED")
                  self.assertTrue(any("safe basename" in x for x in r["not_verified"]))
          
              def test_source_map_unknown_digest_format(self):
                  r = self.make({"ref.py": 17})
                  self.assertEqual(r["result"], "NOT_VERIFIED")
          
              def test_duplicate_source_map_json_key(self):
                  expected = digest(b"original synthetic")
                  raw = ('{"sources":{"ref.py":"' + expected + '","ref.py":"' + expected + '"}}').encode()
                  r = self.make(raw_manifest=raw)
                  self.assertEqual(r["result"], "FAIL")
                  self.assertTrue(any("invalid JSON" in x for x in r["failures"]))
          
          
          '''
          entry='if __name__ == "__main__":\n    unittest.main(verbosity=2)'
          assert files[test].count(entry)==1
          files[test]=files[test].replace(entry,insert+entry)
          report='''# PH-08 Stage 4 evidence integrity and schema reconciliation
          
          **2026-10-16 KST; provenance only; not a physical solver qualification.**
          
          An authorized copy of \`boardsi-ph08-stage4-qualification.zip\` was located in the personal file Library. The raw archive remains outside GitHub; only the non-confidential, limited integrity summary is committed here.
          
          - Original archive byte size: **2,301,227**.
          - Archive SHA-256: \`6ade7f1e42db9b52f6243929183f1004a04f3f07950f37c903f592e60c05cda9\`; independently recomputed and matched historical external SHA.
          - ZIP members: **339**; checksum list entries: **338**; actual checked digests **338/338** matched; unlisted **0**.
          - Actual \`evidence/manifest.json\` contains \`sources\` as a mapping of 20 **basenames** to SHA-256 strings. The Stage 5E auditor initially returned \`NOT_VERIFIED\` because it recognized list schemas only; this was an unsupported schema, not a physical failure.
          - Independently canonicalized each basename to the archive-root-relative \`evidence/source_snapshot/<basename>\`, checked the actual raw data bytes, and found **20/20 matching source digests**.
          - No claim is made that exploratory \`development-failures\` copies have the same hash: some intentionally differ; only the exact source snapshot is authoritative for this inventory.
          - The Stage 4 archive's own status indicates preregistration, **not a Contract freeze**. Its original uniform quadratic gradient Gate Q remains **FAIL**; AC-P1 **PENDING**, contract **NOT FROZEN**, and Rust FEM **NO-GO**.
          - Stage 5B raw ZIP remains unavailable. Do not transfer this Stage 4 338/20 success onto Stage 5B.
          - The GitHub auditor now accepts the exact safe Stage 4 dictionary layout, retains strict duplicate JSON key failure, and adds five synthetic mapping cases. No original archive contents or private local paths are committed.
          
          This is an integrity and schema qualification only. It must not be cited as a verified reference for whole-space C/C0, field error or PH-08 Rust implementation.
          '''
          files["docs/validation/m2-g2-ph08-stage4-integrity-recheck.md"]=report
          with tempfile.TemporaryDirectory() as td:
              root=pathlib.Path(td)
              for path,contents in files.items():
                  if not path.endswith(".py"):continue
                  (root/pathlib.Path(path).name).write_text(contents,encoding="utf-8")
              direct=subprocess.run([sys.executable,str(root/"test_ph08_evidence_audit.py")],cwd=root,capture_output=True,text=True)
              discover=subprocess.run([sys.executable,"-m","unittest","discover","-s",str(root),"-p","test_ph08_evidence_audit.py","-v"],cwd=root,capture_output=True,text=True)
              print(direct.stderr[-1600:])
              print(discover.stderr[-600:])
              assert direct.returncode==0 and discover.returncode==0
              assert "Ran 29 tests" in direct.stderr and "Ran 29 tests" in discover.stderr
          
          files_base64=[{"path":name,"contents":base64.b64encode(content.encode()).decode()} for name,content in files.items()]
          result=fetch("https://api.github.com/graphql",{"query":"mutation($input:CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid url}}}","variables":{"input":{
            "branch":{"repositoryNameWithOwner":repo,"branchName":dst},
            "message":{"headline":"test(m2): recognize PH-08 Stage 4 source snapshot mapping","body":"Validate actual Stage 4 manifest dictionary schema; 29 synthetic tests. Archive remains private; Gate Q FAIL and AC-P1 PENDING."},
            "fileChanges":{"additions":files_base64},
            "expectedHeadOid":base_sha
          }}})
          assert not result.get("errors"),result.get("errors")
          commit=result["data"]["createCommitOnBranch"]["commit"]
          print("SIGNED_STAGE4_SCHEMA_COMMIT",commit["oid"],commit["url"])
          
          PY
