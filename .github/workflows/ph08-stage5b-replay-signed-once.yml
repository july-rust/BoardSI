name: One-shot verified Stage 5B replay helper publisher
on:
  push:
    branches:
      - ops/ph08-stage5b-replay-sign-20261017
    paths:
      - ".github/workflows/ph08-stage5b-replay-signed-once.yml"
permissions:
  contents: write
jobs:
  verified-publisher:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 0291ffe2d9e18efd53d33d95047fa5e665bab3e2
          persist-credentials: false
      - name: GitHub Verified publication of exact public source tree
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import base64,json,os,pathlib,subprocess,urllib.request
          SOURCE="0291ffe2d9e18efd53d33d95047fa5e665bab3e2"
          BASE="2178f319e209f3509b20ae7e8899e9396503b90d"
          paths=[
              "tools/validation/ph08_stage5b_original_replay.py",
              "tools/validation/test_ph08_stage5b_original_replay.py",
              ".github/workflows/m2-ph08-stage5b-preflight.yml",
              "docs/validation/m2-g2-ph08-stage5b-private-replay-runbook.md",
              "docs/validation/README.md",
          ]
          if subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()!=SOURCE:
              raise SystemExit("SOURCE_COMMIT_SHA_NOT_PINNED")
          files=[]
          for name in paths:
              p=pathlib.Path(name)
              if not p.is_file() or p.is_symlink():
                  raise SystemExit("SOURCE_FILE_INVALID")
              files.append({"path":name,"contents":base64.b64encode(p.read_bytes()).decode()})
          query="mutation($input:CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid url}}}"
          request_data={
              "query":query,"variables":{"input":{
                  "branch":{"repositoryNameWithOwner":"july-rust/BoardSI",
                            "branchName":"publish/ph08-stage5b-replay-verified-20261017"},
                  "expectedHeadOid":BASE,
                  "message":{"headline":"test(ph08): trusted private Stage 5B original FAIL replay"},
                  "fileChanges":{"additions":files}}}}
          req=urllib.request.Request(
              "https://api.github.com/graphql",
              data=json.dumps(request_data,separators=(",",":")).encode(),method="POST",
              headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                       "Accept":"application/vnd.github+json",
                       "Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=35) as response:
              result=json.load(response)
          if result.get("errors") or not result.get("data",{}).get("createCommitOnBranch"):
              raise SystemExit("VERIFIED_PUBLISH_REJECTED")
          print("SIGNED_COMMIT_SHA="+result["data"]["createCommitOnBranch"]["commit"]["oid"])
          print("PUBLISHED_PUBLIC_FILES="+str(len(files)))
          PY
