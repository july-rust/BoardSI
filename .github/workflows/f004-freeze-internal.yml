name: F004 Freeze Independent Golden Once
on:
  push:
    branches: [feat/f004-compatibility-golden]
permissions:
  contents: write
jobs:
  freeze:
    if: github.repository == 'july-rust/BoardSI'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Freeze a synthetic v1 file exactly once
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import pathlib
          import sqlite3
          root = pathlib.Path("schemas/bsi")
          target = root / "golden-v1-empty.bsi"
          digest = root / "golden-v1-empty.sha256"
          if target.exists():
              assert digest.is_file(), "frozen binary missing SHA manifest"
              assert hashlib.sha256(target.read_bytes()).hexdigest() == digest.read_text().strip()
          else:
              conn = sqlite3.connect(str(target))
              try:
                  conn.executescript((root / "v1.sql").read_text(encoding="utf-8"))
                  conn.executescript((root / "golden-v1-empty.sql").read_text(encoding="utf-8"))
                  assert conn.execute("PRAGMA integrity_check").fetchone()[0] == "ok"
                  assert conn.execute("PRAGMA foreign_key_check").fetchall() == []
                  conn.commit()
              finally:
                  conn.close()
              digest.write_text(hashlib.sha256(target.read_bytes()).hexdigest() + "\n")
          print("frozen_gold_sha256=" + digest.read_text().strip())
          PY
          git add schemas/bsi/golden-v1-empty.bsi schemas/bsi/golden-v1-empty.sha256
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "test(F_004): freeze independent binary v1 Golden"
            git push origin HEAD:refs/heads/feat/f004-compatibility-golden
          fi
