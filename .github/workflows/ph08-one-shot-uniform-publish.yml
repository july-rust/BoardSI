name: PH-08 one-shot verified exact uniform identity publisher
on:
  push:
    branches:
      - feature/ph08-uniform-quadratic-identity
    paths:
      - ".github/workflows/ph08-one-shot-uniform-publish.yml"
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'july-rust/BoardSI'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate staged synthetic source and privacy
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 382cf684cca9ea8b785051902949dd74c5a1b3a5 HEAD
          python -m unittest discover -s tools/validation -p 'test_ph08_uniform_quadratic_identity.py' -v
          python tools/validation/ph08_private_archive_guard.py
      - name: Publish four allowlisted public files as GitHub Verified commits
        shell: bash
        run: |
          set -euo pipefail
          repo=july-rust/BoardSI
          target=feature/ph08-uniform-identity-verified
          base=66506dd5dbf9a358457bb1765898319c29d4df79
          actual=$(gh api "repos/$repo/git/ref/heads/$target" --jq '.object.sha')
          test "$actual" = "$base" || { echo "Verified target branch moved; refuse publishing"; exit 1; }
          for file in \
            tools/validation/ph08_uniform_quadratic_identity.py \
            tools/validation/test_ph08_uniform_quadratic_identity.py \
            docs/validation/m2-g2-ph08-uniform-quadratic-identity.md \
            .github/workflows/m2-ph08-uniform-quadratic-identity.yml
          do
            expected=$(git hash-object "$file")
            encoded=$(base64 -w0 "$file")
            response=$(gh api -X PUT "repos/$repo/contents/$file" \
              -f "branch=$target" \
              -f "message=test(ph08): verified exact uniform publish $file" \
              -f "content=$encoded")
            actual_blob=$(printf '%s' "$response" | jq -r '.content.sha')
            signed_commit=$(printf '%s' "$response" | jq -r '.commit.sha')
            test "$expected" = "$actual_blob" || { echo "Source blob changed: $file"; exit 1; }
            verified=$(gh api "repos/$repo/git/commits/$signed_commit" --jq '.verification.verified')
            test "$verified" = true || { echo "Unsigned publisher commit: $file"; exit 1; }
            echo "GitHub Verified $file $signed_commit"
          done
          echo "Four exact-source GitHub Verified commits complete; no signer workflow copied."
