name: One-shot PH-08 fixed-operator GitHub Verified publish
on:
  push:
    branches: [ops/ph08-fixed-operator-signer-20261017]
    paths: [".github/workflows/ph08-fixed-operator-signed-once.yml"]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 335bb1ab292dc14a097f2d5578ed078559ebefc3
          persist-credentials: false
      - name: Publish SHA-pinned source bytes as GitHub Verified
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, base64, pathlib, subprocess, urllib.request
          source="335bb1ab292dc14a097f2d5578ed078559ebefc3"
          expected_tree="14827d6e36ed97a27a3ecb1f08b0d63178adb766"
          parent="03f51d3a4f4104e7f7d52fb49a3302969de50d21"
          paths=[
              "tools/validation/ph08_recovery_fixed_operator_budget.py",
              "tools/validation/test_ph08_recovery_fixed_operator_budget.py",
              "docs/validation/m2-g2-ph08-fixed-operator-error-budget.md",
              ".github/workflows/m2-ph08-fixed-operator-budget.yml",
          ]
          actual=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          tree=subprocess.check_output(["git","rev-parse","HEAD^{tree}"],text=True).strip()
          if actual!=source or tree!=expected_tree:
              raise SystemExit("PINNED_CHECKOUT_MISMATCH")
          changes=[]
          for name in paths:
              p=pathlib.Path(name)
              if not p.is_file() or p.is_symlink():
                  raise SystemExit("SOURCE_INVENTORY_MISMATCH")
              changes.append({"path":name,"contents":base64.b64encode(p.read_bytes()).decode()})
          mutation="mutation($input:CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid}}}"
          payload={"query":mutation,"variables":{"input":{
              "branch":{"repositoryNameWithOwner":"july-rust/BoardSI",
                        "branchName":"publish/ph08-fixed-operator-verified-20261017"},
              "expectedHeadOid":parent,
              "message":{"headline":"test(ph08): exact fixed-operator error decomposition with synthetic gates"},
              "fileChanges":{"additions":changes}}}}
          req=urllib.request.Request("https://api.github.com/graphql",
              method="POST",data=json.dumps(payload).encode(),
              headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                       "Accept":"application/vnd.github+json",
                       "Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=40) as response:
              answer=json.load(response)
          if answer.get("errors") or not answer.get("data",{}).get("createCommitOnBranch"):
              raise SystemExit("GITHUB_VERIFIED_PUBLISH_REFUSED")
          print("SIGNED_SHA="+answer["data"]["createCommitOnBranch"]["commit"]["oid"])
          PY
