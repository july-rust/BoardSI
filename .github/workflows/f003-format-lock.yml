name: F003 One-Time Format and Lockfile
on:
  pull_request:
permissions:
  contents: write
jobs:
  normalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/f003-native-writer-reader'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Pin toolchain and format
        run: |
          rustup toolchain install 1.75.0 --profile minimal --component rustfmt
          cargo fmt --all
          cargo generate-lockfile
      - name: Commit only generated files when changed
        run: |
          git add Cargo.lock crates/boardsi-native
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "style(F_003): rustfmt native code and lock SQLite dependencies"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
